<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin to Win</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root {
    --ground:      #E9E7F0;
    --surface:     #FCFBFE;
    --surface-2:   #F2F0F8;
    --ink:         #1A1726;
    --ink-soft:    #5C5670;
    --line:        #D5D1E2;
    --brass:       #A9721B;
    --brass-lit:   #D9A644;
    --brass-dim:   #E4D3AE;
    --shadow:      rgba(26, 23, 38, .16);
    --shadow-deep: rgba(26, 23, 38, .24);
    --rim-a:       #F0DCA8;
    --rim-b:       #A9721B;
    --rim-c:       #6E4910;
    --hub-face:    #FBF8F1;

    --display: "Alfa Slab One", "Rockwell", Georgia, serif;
    --ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --mono: "Space Mono", "SFMono-Regular", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:      #131120;
      --surface:     #1D1A2B;
      --surface-2:   #262235;
      --ink:         #EFECF7;
      --ink-soft:    #9C95B0;
      --line:        #353047;
      --brass:       #E4AC4E;
      --brass-lit:   #F5D590;
      --brass-dim:   #6B4E1C;
      --shadow:      rgba(0, 0, 0, .45);
      --shadow-deep: rgba(0, 0, 0, .6);
      --rim-a:       #F5D590;
      --rim-b:       #B07E23;
      --rim-c:       #503309;
      --hub-face:    #2B2539;
    }
  }

  :root[data-theme="dark"] {
    --ground:      #131120;
    --surface:     #1D1A2B;
    --surface-2:   #262235;
    --ink:         #EFECF7;
    --ink-soft:    #9C95B0;
    --line:        #353047;
    --brass:       #E4AC4E;
    --brass-lit:   #F5D590;
    --brass-dim:   #6B4E1C;
    --shadow:      rgba(0, 0, 0, .45);
    --shadow-deep: rgba(0, 0, 0, .6);
    --rim-a:       #F5D590;
    --rim-b:       #B07E23;
    --rim-c:       #503309;
    --hub-face:    #2B2539;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 400 15px/1.55 var(--ui);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: clamp(1080px, calc(100vh + 480px), 2400px);
    max-width: clamp(1080px, calc(100dvh + 480px), 2400px);
    margin: 0 auto;
    padding-inline: 20px;
    padding-block: 26px 30px;
  }

  /* ---------- masthead ---------- */

  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 18px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--brass);
    margin-bottom: 28px;
  }

  .wordmark {
    font: 400 clamp(1.75rem, 5vw, 2.4rem)/1 var(--display);
    margin: 0;
    letter-spacing: -.015em;
    /* Wrap the buttons, never the name. */
    white-space: nowrap;
  }
  .wordmark em {
    font-style: normal;
    color: var(--brass);
  }

  /* The masthead reads as a heading but edits like a field. */
  .wordmark-btn,
  .wordmark-input {
    font: inherit;
    letter-spacing: inherit;
    padding: 3px 9px;
    margin-left: -10px;
    border: 1px solid transparent;
    border-radius: 4px;
  }
  .wordmark-btn {
    display: block;
    background: none;
    color: inherit;
    text-align: left;
    cursor: text;
    transition: border-color .15s ease;
  }
  .wordmark-btn:hover { border-color: var(--line); }
  .wordmark-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .wordmark-input {
    width: 15ch;
    max-width: 100%;
    border-color: var(--brass);
    background: var(--surface);
    color: var(--ink);
  }
  .wordmark-input:focus { outline: none; }
  .wordmark-input[hidden],
  .wordmark-btn[hidden] { display: none; }

  .tagline[hidden] { display: none; }

  .tagline {
    margin: 0;
    color: var(--ink-soft);
    font-size: .95rem;
    max-width: 44ch;
  }

  .links {
    margin-left: auto;
    font: 400 10px/1 var(--mono)
  }

  .header-actions {
    align-self: center;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .header-button {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 9px 13px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--surface);
    color: var(--ink-soft);
    font: 400 11px/1 var(--mono);
    letter-spacing: .14em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: color .15s ease, border-color .15s ease;
  }
  .header-button:hover { color: var(--brass); border-color: var(--brass); }
  .header-button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .header-button[disabled] { opacity: .45; cursor: default; }
  .header-button[disabled]:hover { color: var(--ink-soft); border-color: var(--line); }
  .header-button[hidden] { display: none; }
  .header-button svg {
    width: 13px;
    height: 13px;
    flex: none;
  }
  .header-button.icon-only { padding: 9px; }
  .header-button.icon-only svg { width: 15px; height: 15px; }

  #panelToggle svg { transition: transform .2s ease; }
  #panelToggle[aria-expanded="false"] svg { transform: rotate(180deg); }

  #soundToggle .slash { display: none; }
  #soundToggle[aria-pressed="false"] .wave { display: none; }
  #soundToggle[aria-pressed="false"] .slash { display: block; }

  /* ---------- board ---------- */

  /* Classes and sizes come from layoutBoard(); CSS can't weigh wheel size against layout. */
  .board {
    container: board / inline-size;
    --side-w: 340px;
    --wheel-w: 300px;
    --verdict-w: 240px;
    --verdict-h: 68px;
    --stage-gap: 14px;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 28px;
    align-items: start;
  }
  .board.is-collapsed { --side-w: 280px; }
  .board.side-beside { grid-template-columns: minmax(0, 1fr) var(--side-w); }

  /* max-width is set by JS to force the chosen column count. */
  .wheels {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-inline: auto;
  }

  .board.is-multi .wheel-card {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 12px 12px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .board.is-multi .wheel-card.is-active {
    border-color: var(--brass);
    box-shadow: 0 2px 14px var(--shadow);
  }

  /* A lone wheel needs no title bar — the board's own name covers it. */
  .card-head { display: none; }
  .board.is-multi .card-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  /* A plain label until you click it, an input the whole time. */
  .card-name {
    flex: 1 1 auto;
    /* Zero basis, so the wheel sets the tile's width and not the field. */
    width: 0;
    min-width: 0;
    padding: 4px 6px;
    margin-left: -7px;
    border: 1px solid transparent;
    border-radius: 3px;
    background: transparent;
    color: var(--ink-soft);
    font: 400 10px/1.4 var(--mono);
    letter-spacing: .2em;
    text-transform: uppercase;
    text-overflow: ellipsis;
    cursor: text;
    transition: border-color .15s ease, background .15s ease;
  }
  .card-name::placeholder { color: var(--ink-soft); opacity: .8; }
  .card-name:hover { border-color: var(--line); }
  .card-name:focus {
    outline: none;
    border-color: var(--brass);
    background: var(--surface);
    color: var(--ink);
  }
  .wheel-card.is-active .card-name { color: var(--brass); }
  .wheel-card.is-active .card-name:focus { color: var(--ink); }

  .card-remove {
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    flex: none;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .card-remove:hover { color: var(--brass); border-color: var(--brass); }
  .card-remove:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .card-remove[disabled] { opacity: .45; cursor: default; }
  .card-remove svg { display: block; width: 12px; height: 12px; }

  /* ---------- stage ---------- */

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--stage-gap);
  }
  .board.verdict-beside .stage { flex-direction: row; }

  .wheel-wrap {
    position: relative;
    flex: none;
    width: var(--wheel-w);
    aspect-ratio: 1;
    container-type: inline-size;
  }

  /* Clips the rotating canvas's corners, which would otherwise widen the page. */
  .wheel-disc {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    filter: drop-shadow(0 10px 22px var(--shadow));
  }

  .wheel-canvas {
    display: block;
    width: 100%;
    height: 100%;
    max-width: 100%;
    will-change: transform;
  }

  .spin-target {
    position: absolute;
    inset: 0;
    border: 0;
    padding: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    z-index: 3;
  }
  .spin-target:focus-visible {
    outline: 3px solid var(--brass);
    outline-offset: 5px;
  }
  .spin-target[disabled] { cursor: default; }

  .hub {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 23%;
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 34% 28%, var(--rim-a), var(--rim-b) 62%, var(--rim-c) 100%);
    box-shadow:
      0 0 0 3px var(--hub-face),
      0 4px 12px var(--shadow-deep),
      inset 0 -3px 6px rgba(0, 0, 0, .3);
    display: grid;
    place-items: center;
    z-index: 2;
    pointer-events: none;
    transition: transform .18s ease;
  }
  .spin-target:hover + .hub { transform: translate(-50%, -50%) scale(1.06); }
  .spin-target[disabled] + .hub { transform: translate(-50%, -50%) scale(.95); }

  .hub span {
    font: 700 clamp(9px, 4cqw, 20px)/1 var(--mono);
    letter-spacing: .14em;
    color: #2E1D04;
    text-transform: uppercase;
  }

  .pointer {
    position: absolute;
    left: 50%;
    top: -2.2%;
    width: 12%;
    margin-left: -6%;
    transform-origin: 50% 14%;
    z-index: 4;
    pointer-events: none;
    filter: drop-shadow(0 3px 5px var(--shadow-deep));
  }
  .pointer svg { display: block; width: 100%; height: auto; }

  /* ---------- verdict ---------- */

  .verdict {
    width: var(--verdict-w);
    flex: none;
    min-height: 152px;
    border: 1px solid var(--line);
    border-top: 3px solid var(--brass);
    border-radius: 3px;
    background: var(--surface);
    box-shadow: 0 2px 10px var(--shadow);
    padding: 16px 20px 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 10px;
    text-align: center;
  }

  .verdict-label {
    font: 400 10px/1 var(--mono);
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .verdict-name {
    font: 400 clamp(1.4rem, 4.6vw, 2rem)/1.15 var(--display);
    margin: 0;
    color: var(--ink);
    overflow-wrap: anywhere;
    text-wrap: balance;
    min-height: calc(clamp(1.4rem, 4.6vw, 2rem) * 1.15);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .verdict-name.is-idle {
    font-family: var(--ui);
    font-weight: 500;
    font-size: 1rem;
    color: var(--ink-soft);
  }
  .verdict.is-won .verdict-name { animation: pop .42s cubic-bezier(.2, 1.5, .4, 1); }

  .verdict-img {
    display: inline-block;
    height: 1.6em;
    width: auto;
    max-width: 100%;
    vertical-align: middle;
    object-fit: contain;
    border-radius: 2px;
  }
  .verdict-img.is-before { margin-right: .3em; }
  .verdict-img.is-after { margin-left: .3em; }
  .verdict-img.is-alone { height: 3em; }

  @keyframes pop {
    from { transform: scale(.82); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  .verdict-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .verdict-actions.is-idle { visibility: hidden; }

  .odds {
    margin: 0;
    font: 400 11px/1.4 var(--mono);
    color: var(--ink-soft);
    letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
  }

  /* Fixed height so layoutBoard() can budget for it; the log shows long names whole. */
  .board:not(.verdict-beside) .verdict {
    width: var(--wheel-w);
    height: var(--verdict-h);
    min-height: 0;
    padding: 7px 12px 8px;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas: "label odds odds" "name name actions";
    align-items: center;
    align-content: center;
    gap: 3px 12px;
    text-align: left;
  }
  .board:not(.verdict-beside) .verdict-label { grid-area: label; }
  .board:not(.verdict-beside) .odds {
    grid-area: odds;
    font-size: 10px;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .board:not(.verdict-beside) .verdict-name {
    grid-area: name;
    display: block;
    min-height: 0;
    font-size: 1.3rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .board:not(.verdict-beside) .verdict-name.is-idle { font-size: 13.5px; }
  .board:not(.verdict-beside) .verdict-img { height: 1.15em; }
  .board:not(.verdict-beside) .verdict-actions { grid-area: actions; flex-wrap: nowrap; }
  .board:not(.verdict-beside) .verdict-actions.is-idle { display: none; }
  /* The wheel itself is the spin-again button. */
  .board:not(.verdict-beside) .verdict-actions .again { display: none; }
  .board:not(.verdict-beside) .verdict-actions button.act { padding: 6px 10px; font-size: 12px; }

  /* ---------- side: results and lists ---------- */

  .side {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* Sticky and self-scrolling so any list is reachable without losing sight of the wheels. */
  .board.side-beside .side {
    position: sticky;
    top: 12px;
    /* The same height the wheels get, so it never lengthens the page. */
    max-height: var(--side-h, calc(100vh - 24px));
    overflow-y: auto;
    padding: 3px;
  }

  .lists {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .board:not(.side-beside) .lists {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 22px 24px;
  }
  .board.is-collapsed .lists { display: none; }

  @container board (min-width: 760px) {
    .board:not(.side-beside) .side {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      grid-template-areas: "lists results";
      gap: 32px;
      align-items: start;
    }
    .board:not(.side-beside) .lists { grid-area: lists; }
    .board:not(.side-beside) .results { grid-area: results; }
    .board.is-collapsed:not(.side-beside) .side { display: flex; }
  }

  .list-card { min-width: 0; }
  .board.is-multi .list-card.is-active .entries-label { color: var(--brass); }
  .entries-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .field-head {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
    font: 400 10px/1 var(--mono);
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .field-meta {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .field-meta b {
    font-weight: 700;
    color: var(--brass);
    font-variant-numeric: tabular-nums;
    letter-spacing: .08em;
  }

  .info-btn {
    display: grid;
    place-items: center;
    width: 20px;
    height: 20px;
    flex: none;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .info-btn:hover,
  .info-btn[aria-expanded="true"] { color: var(--brass); border-color: var(--brass); }
  .info-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .info-btn svg { display: block; width: 13px; height: 13px; }

  .help-pop {
    position: absolute;
    top: calc(100% + 9px);
    right: 0;
    z-index: 5;
    width: min(330px, 100%);
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-top: 3px solid var(--brass);
    border-radius: 3px;
    background: var(--surface);
    box-shadow: 0 10px 28px var(--shadow-deep);
    font: 400 13px/1.6 var(--ui);
    letter-spacing: normal;
    text-transform: none;
    color: var(--ink-soft);
  }
  .help-pop[hidden] { display: none; }
  .help-pop p { margin: 0 0 9px; }
  .help-pop p:last-child { margin-bottom: 0; }

  .entries {
    width: 100%;
    min-height: 210px;
    resize: vertical;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--surface);
    color: var(--ink);
    font: 400 13px/1.85 var(--mono);
    box-shadow: inset 0 1px 3px var(--shadow);
  }
  .board.is-multi .entries { min-height: 130px; }
  .entries:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 1px;
    border-color: var(--brass);
  }

  .hint {
    margin: 8px 0 0;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .hint[hidden] { display: none; }

  .hint code,
  .help-pop code {
    font: 400 12px/1.5 var(--mono);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 1px 4px;
    color: var(--ink);
    white-space: nowrap;
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  button.act {
    font: 500 13px/1 var(--ui);
    padding: 9px 14px;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  button.act:hover { background: var(--surface); border-color: var(--brass); }
  button.act:active { transform: translateY(1px); }
  button.act:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  button.act[disabled] { opacity: .45; cursor: default; }
  button.act[disabled]:hover { background: var(--surface-2); border-color: var(--line); }

  button.act.primary {
    background: var(--brass);
    border-color: var(--brass);
    color: #231703;
    font-weight: 600;
  }
  button.act.primary:hover { background: var(--brass-lit); border-color: var(--brass-lit); }

  .history-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 7px;
    margin-bottom: 4px;
  }
  .history-head h2 {
    font: 400 10px/1 var(--mono);
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0;
  }
  .link-btn {
    background: none;
    border: 0;
    padding: 2px 0;
    font: 400 11px/1 var(--mono);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .link-btn:hover { color: var(--brass); }
  .link-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .history {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    max-height: 240px;
    overflow-y: auto;
  }
  .history li {
    display: grid;
    grid-template-columns: 2.6em minmax(0, 1fr) auto;
    gap: 10px;
    align-items: baseline;
    padding: 7px 2px;
    border-bottom: 1px dotted var(--line);
    font-size: 14px;
  }
  .history li:last-child { border-bottom: 0; }
  .history .n {
    font: 400 11px/1.5 var(--mono);
    color: var(--brass);
    font-variant-numeric: tabular-nums;
  }
  .history .who { overflow-wrap: anywhere; }
  .history .log-img {
    height: 1.5em;
    width: auto;
    max-width: 4em;
    margin-right: .4em;
    vertical-align: middle;
    object-fit: contain;
    border-radius: 2px;
  }
  .history .tag {
    max-width: 14ch;
    font: 400 10px/1.5 var(--mono);
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-empty {
    margin: 10px 0 0;

  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .external-link {
    color: var(--ink-soft)
  }

  .external-link:hover {
    color: var(--ink)
  }

  /* ---------- minimal view ---------- */

  :root.is-minimal,
  :root.is-minimal body { overflow: hidden; }
  :root.is-minimal.is-embed,
  :root.is-minimal.is-embed body { background: transparent; }
  .is-minimal.is-embed .wheel-disc { filter: none; }

  .is-minimal .masthead { display: none; }
  .is-minimal #board .side { display: none; }
  .is-minimal .page {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 3vmin;
  }
  .is-minimal .board {
    --verdict-h: 0px;
    --verdict-w: 0px;
    --stage-gap: 0px;
  }
  .is-minimal .wheels { gap: 3vmin; }

  /* Pointer on the right, where a label reads upright. Turning the whole
     wrap keeps the spin maths untouched; the hub and shadows turn back. */
  .is-minimal .wheel-wrap { transform: rotate(90deg); }
  .is-minimal .wheel-disc { filter: drop-shadow(10px 0 22px var(--shadow)); }
  .is-minimal .pointer { filter: drop-shadow(3px 0 5px var(--shadow-deep)); }
  .is-minimal .hub { transform: translate(-50%, -50%) rotate(-90deg); }
  .is-minimal .spin-target:hover + .hub { transform: translate(-50%, -50%) rotate(-90deg) scale(1.06); }
  .is-minimal .spin-target[disabled] + .hub { transform: translate(-50%, -50%) rotate(-90deg) scale(.95); }
  .is-minimal .board.is-multi .wheel-card {
    border: 0;
    padding: 0;
    box-shadow: none;
  }
  .is-minimal .board.is-multi .card-head,
  .is-minimal .board .stage .verdict { display: none; }

  .min-bar { display: none; }
  .is-minimal .min-bar {
    position: fixed;
    top: 8px;
    right: 8px;
    z-index: 10;
    display: flex;
    gap: 8px;
    opacity: 0;
    transition: opacity .2s ease;
  }
  .is-minimal .min-bar:hover,
  .is-minimal .min-bar:focus-within,
  .is-minimal .min-bar.is-peek { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .verdict.is-won .verdict-name { animation: none; }

  }

<script>
(function () {
  "use strict";

  var TAU = Math.PI * 2;

  var PALETTE = [
    "#C4382C", "#2E7D74", "#B06C18", "#4C4A96", "#4E8442",
    "#A32F63", "#2A6A9E", "#8C5220", "#6E3D96", "#77761F"
  ];

  var SAMPLE = ["Apples", "Oranges", "2#Bananas", "0.5#Pears"];
  var STORE_KEY = "spin-to-win/v2";
  var LEGACY_KEY = "spin-to-win/v1";
  var MAX_ENTRIES = 300;
  var MAX_WHEELS = 8;
  var MAX_NAME = 40;
  var LOG_MAX = 60;
  var MIN_WHEEL = 220;

  var boardEl = document.getElementById("board");
  var wheelsEl = document.getElementById("wheels");
  var listsEl = document.getElementById("lists");
  var logEl = document.getElementById("log");
  var logEmpty = document.getElementById("logEmpty");
  var clearLogBtn = document.getElementById("clearLog");
  var tpl = document.getElementById("wheelTpl");
  var listTpl = document.getElementById("listTpl");
  var pageEl = document.querySelector(".page");
  var mastheadEl = document.querySelector(".masthead");
  var panelToggle = document.getElementById("panelToggle");
  var panelToggleLabel = document.getElementById("panelToggleLabel");
  var addWheelBtn = document.getElementById("addWheel");
  var spinAllBtn = document.getElementById("spinAll");
  var copyBtn = document.getElementById("copyBtn");
  var copyLabel = document.getElementById("copyLabel");
  var soundBtn = document.getElementById("soundToggle");
  var titleBtn = document.getElementById("titleBtn");
  var titleText = document.getElementById("titleText");
  var titleInput = document.getElementById("titleInput");
  var taglineEl = document.getElementById("tagline");
  var minimalBtn = document.getElementById("minimalBtn");
  var minBar = document.getElementById("minBar");
  var embedCopy = document.getElementById("embedCopy");
  var embedLabel = document.getElementById("embedLabel");
  var minExit = document.getElementById("minExit");

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  var wheels = [];
  var wheelSeq = 0;
  var activeWheel = null;
  var panelOpen = true;
  /* Kept apart so a link can collapse the lists without changing the saved preference. */
  var storedPanel = true;
  var soundOn = true;
  var boardTitle = "";
  var log = [];

  /* Saved board held back while a link is shown, so opening a link never loses it. */
  var boardFromUrl = false;
  var shadow = null;

  /* ---------- link payload ---------- */

  var B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
  var B64REV = (function () {
    var m = {};
    for (var i = 0; i < 64; i++) m[B64.charAt(i)] = i;
    return m;
  })();
  var MAXCODE = 32768;
  var hasCodec = typeof TextEncoder === "function" && typeof TextDecoder === "function";

  function bytesToB64(bytes) {
    var out = "", i = 0, n;
    for (; i + 2 < bytes.length; i += 3) {
      n = (bytes[i] << 16) | (bytes[i + 1] << 8) | bytes[i + 2];
      out += B64.charAt((n >> 18) & 63) + B64.charAt((n >> 12) & 63) +
             B64.charAt((n >> 6) & 63) + B64.charAt(n & 63);
    }
    var rem = bytes.length - i;
    if (rem === 1) {
      n = bytes[i] << 16;
      out += B64.charAt((n >> 18) & 63) + B64.charAt((n >> 12) & 63);
    } else if (rem === 2) {
      n = (bytes[i] << 16) | (bytes[i + 1] << 8);
      out += B64.charAt((n >> 18) & 63) + B64.charAt((n >> 12) & 63) + B64.charAt((n >> 6) & 63);
    }
    return out;
  }

  function b64ToBytes(str) {
    var out = [], acc = 0, bits = 0;
    for (var i = 0; i < str.length; i++) {
      var v = B64REV[str.charAt(i)];
      if (v === undefined) return null;
      acc = (acc << 6) | v;
      bits += 6;
      if (bits >= 8) { bits -= 8; out.push((acc >>> bits) & 0xFF); }
    }
    return Uint8Array.from(out);
  }

  function lzwEncode(bytes) {
    if (!bytes.length) return new Uint8Array(0);
    var dict = {}, width = 9, next = 256;
    var out = [], acc = 0, bits = 0;
    function emit(code) {
      acc = (acc << width) | code;
      bits += width;
      while (bits >= 8) { bits -= 8; out.push((acc >>> bits) & 0xFF); }
      acc &= (1 << bits) - 1;
    }
    var w = String.fromCharCode(bytes[0]);
    for (var i = 1; i < bytes.length; i++) {
      var c = String.fromCharCode(bytes[i]);
      var wc = w + c;
      if (dict[wc] !== undefined) { w = wc; continue; }
      emit(w.length === 1 ? w.charCodeAt(0) : dict[w]);
      if (next < MAXCODE) {
        dict[wc] = next++;
        if (next === (1 << width) && width < 15) width++;
      }
      w = c;
    }
    emit(w.length === 1 ? w.charCodeAt(0) : dict[w]);
    if (bits) out.push((acc << (8 - bits)) & 0xFF);
    return Uint8Array.from(out);
  }

  function lzwDecode(bytes) {
    if (!bytes.length) return new Uint8Array(0);
    var dict = new Array(256), i;
    for (i = 0; i < 256; i++) dict[i] = String.fromCharCode(i);
    var width = 9, acc = 0, bits = 0, pos = 0;
    function read() {
      while (bits < width) {
        if (pos >= bytes.length) return -1;
        acc = (acc << 8) | bytes[pos++];
        bits += 8;
      }
      bits -= width;
      var c = (acc >>> bits) & ((1 << width) - 1);
      acc &= (1 << bits) - 1;
      return c;
    }
    var code = read();
    if (code < 0 || code >= dict.length) return null;
    var prev = dict[code], res = [prev];
    for (;;) {
      code = read();
      if (code < 0) break;
      var entry;
      if (code < dict.length) entry = dict[code];
      else if (code === dict.length) entry = prev + prev.charAt(0);
      else return null;
      res.push(entry);
      if (dict.length < MAXCODE) {
        dict.push(prev + entry.charAt(0));
        if (dict.length + 1 === (1 << width) && width < 15) width++;
      }
      prev = entry;
    }
    var s = res.join(""), outb = new Uint8Array(s.length);
    for (i = 0; i < s.length; i++) outb[i] = s.charCodeAt(i) & 0xFF;
    return outb;
  }

  /* Obscured so the lists aren't legible in the address bar. */
  function packText(text) {
    var bytes = new TextEncoder().encode(text);
    var lzw = lzwEncode(bytes);
    var useLzw = lzw.length > 0 && lzw.length < bytes.length;
    var body = useLzw ? lzw : bytes;
    var buf = new Uint8Array(body.length + 1);
    buf[0] = useLzw ? 1 : 0;
    buf.set(body, 1);
    return bytesToB64(buf);
  }

  function unpackText(str) {
    if (!hasCodec) return null;
    var buf = b64ToBytes(str);
    if (!buf || buf.length < 2) return null;
    var body = buf.subarray(1);
    var bytes = buf[0] === 1 ? lzwDecode(body) : buf[0] === 0 ? body : null;
    if (!bytes) return null;
    /* Fatal, so a mangled link falls back to the saved board, not replacement characters. */
    try { return new TextDecoder("utf-8", { fatal: true }).decode(bytes); }
    catch (e) { return null; }
  }

  /* ---------- shareable links ---------- */

  /* ?b= is current; ?w/?n/?t, ?list and ?e are older links that must keep opening. */

  function queryString() {
    var s = location.search.replace(/^\?/, "");
    var h = location.hash.replace(/^#/, "");
    if (!h) return s;
    /* A hand-typed "2#Blue" spills into the fragment; stitch it back on. */
    return s ? s + "#" + h : h;
  }

  function trimAll(parts) {
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var s = parts[i].trim();
      if (s) out.push(s);
    }
    return out.length ? out : null;
  }

  function cleanName(s) {
    return String(s).replace(/\s+/g, " ").trim().slice(0, MAX_NAME);
  }

  /* One payload, not a parameter per wheel, so LZW shares one dictionary across lists. */
  var REC = "\x1E";

  function cleanShare(s) {
    /* Control bytes have no place in a label and would confuse the frame. */
    return String(s).replace(/[\x00-\x09\x0B-\x1F\x7F]/g, " ");
  }

  function packBoard() {
    var recs = [cleanShare(boardTitle)];
    for (var i = 0; i < wheels.length; i++) {
      var lines = wheels[i].rawLines();
      if (!lines.length) continue;
      recs.push(cleanShare(wheels[i].getName()) + "\n" + cleanShare(lines.join("\n")));
    }
    return recs.length > 1 ? recs.join(REC) : null;
  }

  function unpackBoard(text) {
    var recs = text.split(REC);
    if (recs.length < 2) return null;
    var out = [];
    for (var i = 1; i < recs.length && out.length < MAX_WHEELS; i++) {
      var lines = recs[i].split("\n");
      var list = trimAll(lines.slice(1));
      if (!list) continue;
      out.push({ list: list, name: cleanName(lines[0]) });
    }
    return out.length ? { title: cleanName(recs[0]), wheels: out } : null;
  }

  function boardFromLink() {
    var params;
    try { params = new URLSearchParams(queryString()); } catch (e) { return null; }

    var whole = params.get("b");
    if (whole) {
      var flat = unpackText(whole.trim());
      return flat === null ? null : unpackBoard(flat);
    }

    var title = "";
    var rawTitle = params.get("t");
    if (rawTitle) {
      var decodedTitle = unpackText(rawTitle.trim());
      if (decodedTitle !== null) title = cleanName(decodedTitle);
    }

    var packed = params.getAll("w");
    if (packed.length) {
      var names = params.getAll("n");
      var out = [];
      for (var i = 0; i < packed.length && out.length < MAX_WHEELS; i++) {
        var text = unpackText(packed[i].trim());
        if (text === null) return null;
        var list = trimAll(text.split(/[\r\n]+/));
        if (!list) continue;
        /* A name that won't decode costs the wheel its title, not the link. */
        var name = "";
        if (names[i]) {
          var decoded = unpackText(names[i].trim());
          if (decoded !== null) name = cleanName(decoded);
        }
        out.push({ list: list, name: name });
      }
      return out.length ? { title: title, wheels: out } : null;
    }

    var parts, raw = params.get("list");
    if (raw === null) raw = params.get("entries");
    if (raw !== null) {
      parts = /[\r\n]/.test(raw) ? raw.split(/[\r\n]+/) : raw.split(",");
    } else {
      parts = params.getAll("e");
      if (!parts.length) return null;
    }
    var one = trimAll(parts);
    return one ? { title: title, wheels: [{ list: one, name: "" }] } : null;
  }

  function shareUrl() {
    var base = location.href.split(/[?#]/)[0];
    var board = packBoard();
    if (!board) return base;
    if (!hasCodec) {
      /* No TextEncoder: a readable single-wheel link beats no link at all. */
      for (var i = 0; i < wheels.length; i++) {
        var lines = wheels[i].rawLines();
        if (lines.length) return base + "?list=" + encodeURIComponent(lines.join("\n"));
      }
      return base;
    }
    return base + "?b=" + packText(board);
  }

  /* ---------- storage ---------- */

  function readStore(key) {
    try { return JSON.parse(localStorage.getItem(key) || "null"); }
    catch (e) { return null; }
  }

  function loadState() {
    var saved = readStore(STORE_KEY);
    if (saved && Array.isArray(saved.wheels)) return saved;

    var old = readStore(LEGACY_KEY);
    if (old && typeof old === "object") {
      var text = typeof old.text === "string" ? old.text
        : Array.isArray(old.entries) ? old.entries.join("\n") : "";
      return {
        title: "",
        wheels: [{ text: text, name: "", history: Array.isArray(old.history) ? old.history : [] }],
        sound: typeof old.sound === "boolean" ? old.sound : true,
        panel: typeof old.panel === "boolean" ? old.panel : true
      };
    }
    return null;
  }

  function readLog(state) {
    var out = [], i;
    if (!state) return out;
    if (Array.isArray(state.log)) {
      for (i = 0; i < state.log.length && out.length < LOG_MAX; i++) {
        var e = state.log[i];
        if (e && typeof e.result === "string") {
          var rec = { wheel: typeof e.wheel === "string" ? e.wheel : "", result: e.result };
          if (typeof e.image === "string" && IMG_SAFE.test(e.image)) rec.image = e.image;
          out.push(rec);
        }
      }
      return out;
    }
    /* Old per-wheel logs have no timestamps, so they can only be concatenated. */
    var ws = Array.isArray(state.wheels) ? state.wheels : [];
    for (i = 0; i < ws.length; i++) {
      var w = ws[i] || {};
      var h = Array.isArray(w.history) ? w.history : [];
      var name = (typeof w.name === "string" && w.name) || "Wheel " + (i + 1);
      for (var j = 0; j < h.length && out.length < LOG_MAX; j++) {
        if (typeof h[j] === "string") out.push({ wheel: name, result: h[j] });
      }
    }
    return out;
  }

  function wheelsForSave() {
    var out = [], i;
    if (!boardFromUrl) {
      for (i = 0; i < wheels.length; i++) out.push(wheels[i].serialize());
      return out;
    }

    /* Persist the saved board, not the one from the link. */
    var kept = (shadow && shadow.wheels) ? shadow.wheels : [];
    for (i = 0; i < kept.length; i++) {
      var w = kept[i] || {};
      out.push({
        text: typeof w.text === "string" ? w.text : "",
        name: typeof w.name === "string" ? w.name : ""
      });
    }
    return out.length ? out : [{ text: "", name: "" }];
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        v: 2,
        title: boardFromUrl ? ((shadow && shadow.title) || "") : boardTitle,
        wheels: wheelsForSave(),
        log: log.slice(0, LOG_MAX),
        sound: soundOn,
        panel: storedPanel
      }));
    } catch (e) { /* ignore and continue, page works without storage */ }
  }

  function claimBoard() {
    if (!boardFromUrl) return;
    boardFromUrl = false;
    for (var i = 0; i < wheels.length; i++) wheels[i].setHint("");
  }

  /* ---------- sound ---------- */

  var audio = null;
  var lastClick = 0;

  function ac() {
    if (!soundOn) return null;
    if (!audio) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      try { audio = new Ctx(); } catch (e) { return null; }
    }
    if (audio.state === "suspended") audio.resume();
    return audio;
  }

  function spinningCount() {
    var n = 0;
    for (var i = 0; i < wheels.length; i++) if (wheels[i].isSpinning()) n++;
    return n;
  }

  /* Simultaneous spins stack into a buzz, so clicks are rate-limited and volume scaled. */
  function voices() { return Math.max(1, Math.sqrt(spinningCount())); }

  function click() {
    var a = ac();
    if (!a) return;
    var now = a.currentTime;
    if (now - lastClick < 0.016) return;
    lastClick = now;
    var osc = a.createOscillator();
    var gain = a.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(1250, now);
    osc.frequency.exponentialRampToValueAtTime(620, now + 0.03);
    gain.gain.setValueAtTime(0.07 / voices(), now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);
    osc.connect(gain).connect(a.destination);
    osc.start(now);
    osc.stop(now + 0.05);
  }

  function chime() {
    var a = ac();
    if (!a) return;
    var t = a.currentTime;
    var peak = 0.16 / voices();
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
      var osc = a.createOscillator();
      var gain = a.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(f, t + i * 0.085);
      gain.gain.setValueAtTime(0.0001, t + i * 0.085);
      gain.gain.exponentialRampToValueAtTime(peak, t + i * 0.085 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.085 + 0.5);
      osc.connect(gain).connect(a.destination);
      osc.start(t + i * 0.085);
      osc.stop(t + i * 0.085 + 0.55);
    });
  }

  /* ---------- board geometry ---------- */

  function chromeHeight() {
    var pg = getComputedStyle(pageEl);
    var root = getComputedStyle(document.documentElement);
    var pad = parseFloat(root.paddingTop) + parseFloat(root.paddingBottom) +
      parseFloat(pg.paddingTop) + parseFloat(pg.paddingBottom);
    /* Hidden, the masthead still reports its margin. */
    if (minimal) return pad;
    return pad + mastheadEl.offsetHeight + parseFloat(getComputedStyle(mastheadEl).marginBottom) + 6;
  }

  function px(style, props) {
    var sum = 0;
    for (var i = 0; i < props.length; i++) sum += parseFloat(style[props[i]]) || 0;
    return sum;
  }

  function cssVar(el, name) {
    return parseFloat(getComputedStyle(el).getPropertyValue(name)) || 0;
  }

  /* Tile space the wheel can't use: frame, title bar and verdict. */
  function tileFrame() {
    var el = wheels[0].el;
    var cs = getComputedStyle(el);
    var head = el.querySelector(".card-head");
    var headH = head.offsetHeight
      ? head.offsetHeight + (parseFloat(getComputedStyle(head).marginBottom) || 0) : 0;
    return {
      x: px(cs, ["paddingLeft", "paddingRight", "borderLeftWidth", "borderRightWidth"]),
      y: px(cs, ["paddingTop", "paddingBottom", "borderTopWidth", "borderBottomWidth"]) + headH,
      gap: parseFloat(getComputedStyle(wheelsEl).columnGap) || 0,
      vh: cssVar(boardEl, "--verdict-h"),
      vw: cssVar(boardEl, "--verdict-w"),
      sg: cssVar(boardEl, "--stage-gap")
    };
  }

  function bestTiling(n, W, H, f) {
    var best = { d: -Infinity, cols: 1, beside: false };
    for (var c = 1; c <= n; c++) {
      var r = Math.ceil(n / c);
      var cellW = (W - (c - 1) * f.gap) / c - f.x;
      var cellH = (H - (r - 1) * f.gap) / r - f.y;
      var under = Math.min(cellW, cellH - f.vh - f.sg);
      var beside = Math.min(cellW - f.vw - f.sg, cellH);
      if (under > best.d) best = { d: under, cols: c, beside: false };
      /* Margin stops layouts flip-flopping; 160 fits the verdict's full height. */
      if (beside >= 160 && beside > best.d + 8) best = { d: beside, cols: c, beside: true };
    }
    return best;
  }

  function layoutBoard() {
    var n = wheels.length;
    if (!n) return;
    boardEl.classList.toggle("is-multi", n > 1);
    /* One wheel keeps the page's narrow measure; a board wants the width. */
    pageEl.style.maxWidth = minimal ? "none" : n > 1 ? "2400px" : "";

    var f = tileFrame();
    var boardW = boardEl.clientWidth || window.innerWidth;
    var H = window.innerHeight - chromeHeight();
    var sideW = cssVar(boardEl, "--side-w") + (parseFloat(getComputedStyle(boardEl).columnGap) || 0);

    /* Wheels come first: the side column sits beside them only if it costs under 20% of their size. */
    var under = bestTiling(n, boardW, H, f);
    var beside = bestTiling(n, boardW - sideW, H, f);
    var sideBeside = !minimal && boardW >= 860 && beside.d >= under.d * 0.8;
    var t = sideBeside ? beside : under;
    var W = sideBeside ? boardW - sideW : boardW;

    /* Below MIN_WHEEL labels get unreadable, so scroll instead of shrinking.
       Minimal view can't scroll: an embed's frame is all the room there is. */
    if (t.d < MIN_WHEEL && !minimal) {
      var d0 = Math.min(MIN_WHEEL, W - f.x);
      var c = Math.max(1, Math.min(n, Math.floor((W + f.gap) / (d0 + f.x + f.gap))));
      t = { d: Math.max(d0, (W - (c - 1) * f.gap) / c - f.x), cols: c, beside: false };
    }

    var d = Math.floor(t.d);
    boardEl.classList.toggle("side-beside", sideBeside);
    boardEl.classList.toggle("verdict-beside", t.beside);
    boardEl.style.setProperty("--wheel-w", d + "px");
    boardEl.style.setProperty("--side-h", Math.floor(H) + "px");
    var tileW = d + f.x + (t.beside ? f.vw + f.sg : 0);
    wheelsEl.style.maxWidth = Math.ceil(t.cols * tileW + (t.cols - 1) * f.gap + 1) + "px";
  }

  function relayout() {
    layoutBoard();
    for (var i = 0; i < wheels.length; i++) wheels[i].resize();
  }

  /* ---------- results log ---------- */

  function addLog(wheel, result, image) {
    var rec = { wheel: wheel, result: result };
    if (image) rec.image = image;
    log.unshift(rec);
    if (log.length > LOG_MAX) log.length = LOG_MAX;
    renderLog();
  }

  /* Wheel names only earn a column once there's more than one wheel. */
  function renderLog() {
    var tagged = wheels.length > 1;
    logEl.textContent = "";
    logEmpty.hidden = log.length > 0;
    clearLogBtn.hidden = log.length === 0;
    for (var i = 0; i < log.length; i++) {
      var li = document.createElement("li");
      var n = document.createElement("span");
      n.className = "n";
      n.textContent = String(log.length - i).padStart(2, "0");
      var who = document.createElement("span");
      who.className = "who";
      who.textContent = log[i].result;
      /* Always leading in the log, so the column of pictures lines up. */
      if (log[i].image) {
        who.insertBefore(makeThumb(log[i].image, "log-img", !log[i].result), who.firstChild);
      }
      li.appendChild(n);
      li.appendChild(who);
      if (tagged && log[i].wheel) {
        var tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = log[i].wheel;
        tag.title = log[i].wheel;
        li.appendChild(tag);
      }
      logEl.appendChild(li);
    }
  }

  clearLogBtn.addEventListener("click", function () {
    log = [];
    renderLog();
    save();
  });

  /* ---------- triggers ---------- */

  function wheelByName(name) {
    var want = String(name).trim().toLowerCase();
    if (!want) return null;
    for (var i = 0; i < wheels.length; i++) {
      if (wheels[i].displayName().toLowerCase() === want) return wheels[i];
    }
    return null;
  }

  /* Target must name a real wheel, so "Ready! Set" stays plain and nothing needs escaping. */
  function splitTrigger(label) {
    var at = label.lastIndexOf("!");
    if (at < 1) return null;
    var target = label.slice(at + 1).trim();
    var head = label.slice(0, at).trim();
    if (!target || !head || !wheelByName(target)) return null;
    return { label: head, target: target };
  }

  /* Wheel names decide which triggers resolve, so any change re-reads every list. */
  function resyncAll() {
    for (var i = 0; i < wheels.length; i++) wheels[i].resync();
  }

  /* ---------- images ---------- */

  /* Only a real link counts, so "[draft] Notes" stays a plain label. */
  var IMG_URL = "((?:https?:\\/\\/|data:image\\/)[^\\]\\s]+)";
  var IMG_PRE = new RegExp("^\\[\\s*" + IMG_URL + "\\s*\\]\\s*(.*)$", "i");
  var IMG_POST = new RegExp("^(.*?)\\s*\\[\\s*" + IMG_URL + "\\s*\\]$", "i");
  var IMG_SAFE = /^(?:https?:\/\/|data:image\/)/i;

  function splitImage(text) {
    var m = IMG_PRE.exec(text);
    if (m) return { label: m[2].trim(), url: m[1], after: false };
    m = IMG_POST.exec(text);
    if (m) return { label: m[1].trim(), url: m[2], after: true };
    return { label: text, url: "", after: false };
  }

  /* Shared across wheels; until loaded, or if it fails, the slice shows just its text. */
  var imageCache = {};
  var redrawPending = false;

  function redrawSoon() {
    if (redrawPending) return;
    redrawPending = true;
    requestAnimationFrame(function () {
      redrawPending = false;
      for (var i = 0; i < wheels.length; i++) wheels[i].draw();
    });
  }

  function imageFor(url) {
    if (!url) return null;
    var rec = imageCache[url];
    if (!rec) {
      rec = imageCache[url] = { el: new Image(), aspect: 1, ready: false };
      rec.el.decoding = "async";
      rec.el.referrerPolicy = "no-referrer";
      rec.el.onload = function () {
        var w = rec.el.naturalWidth, h = rec.el.naturalHeight;
        rec.aspect = w && h ? w / h : 1;
        rec.ready = true;
        redrawSoon();
      };
      rec.el.src = url;
    }
    return rec.ready ? rec : null;
  }

  function makeThumb(url, cls, alone) {
    var img = document.createElement("img");
    img.className = cls;
    img.alt = alone ? "Image" : "";
    img.decoding = "async";
    img.referrerPolicy = "no-referrer";
    img.src = url;
    return img;
  }

  /* ---------- a wheel ---------- */

  function createWheel(init) {
    var card = tpl.content.firstElementChild.cloneNode(true);
    var listCard = listTpl.content.firstElementChild.cloneNode(true);
    var uid = "w" + (++wheelSeq);
    /* Split across two templates, so lookups search both. */
    function q(sel) { return card.querySelector(sel) || listCard.querySelector(sel); }

    var canvas = q(".wheel-canvas");
    var ctx = canvas.getContext("2d");
    var wrap = q(".wheel-wrap");
    var pointerEl = q(".pointer");
    var spinTarget = q(".spin-target");
    var entriesEl = q(".entries");
    var listLabel = q(".entries-label");
    var hintEl = q(".hint");
    var countEl = q(".count");
    var oddsEl = q(".odds");
    var verdictEl = q(".verdict");
    var verdictLabel = q(".verdict-label");
    var verdictName = q(".verdict-name");
    var verdictActions = q(".verdict-actions");
    var spinBtn = q(".act.spin");
    var againBtn = q(".act.again");
    var removeBtn = q(".act.remove");
    var clearBtn = q(".act.clear");
    var helpBtn = q(".info-btn");
    var helpPop = q(".help-pop");
    var nameEl = q(".card-name");
    var removeWheelBtn = q(".card-remove");

    entriesEl.id = uid + "-entries";
    listLabel.htmlFor = entriesEl.id;
    hintEl.id = uid + "-hint";
    entriesEl.setAttribute("aria-describedby", hintEl.id);
    helpPop.id = uid + "-help";
    helpBtn.setAttribute("aria-controls", helpPop.id);

    var entries = [];
    var theta = 0;
    var flap = 0;
    var spinning = false;
    var winnerIdx = -1;
    var size = 0;
    var totalWeight = 0;
    var bounds = [0];
    var idleOdds = "";

    entriesEl.value = (init && typeof init.text === "string") ? init.text : "";
    nameEl.value = (init && typeof init.name === "string") ? cleanName(init.name) : "";

    /* ---------- entries ---------- */

    var WEIGHT_RE = /^(\d*\.?\d+)\s*#\s*(.+)$/;

    function readEntries() {
      var lines = entriesEl.value.split("\n");
      var out = [];
      for (var i = 0; i < lines.length && out.length < MAX_ENTRIES; i++) {
        var s = lines[i].trim();
        if (!s || s[0] === '/') continue;
        var m = WEIGHT_RE.exec(s);
        var weight = m ? parseFloat(m[1]) : 1;
        /* A zero weight is a slice nobody can land on — leave it off. */
        if (!(weight > 0)) continue;
        var label = m ? m[2].trim() : s;
        /* Trigger comes off before the image, so "Cat[url]!Snacks" leaves the image last. */
        var trig = splitTrigger(label);
        var pic = splitImage(trig ? trig.label : label);
        out.push({
          label: pic.label,
          image: pic.url,
          imageAfter: pic.after,
          weight: weight,
          line: i,
          trigger: trig ? trig.target : ""
        });
      }
      return out;
    }

    function rawLines() {
      var lines = entriesEl.value.split("\n");
      var out = [];
      for (var i = 0; i < lines.length; i++) {
        var s = lines[i].trim();
        if (s) out.push(s);
      }
      return out;
    }

    function computeBounds() {
      var n = entries.length, i;
      totalWeight = 0;
      for (i = 0; i < n; i++) totalWeight += entries[i].weight;
      bounds = [0];
      var acc = 0;
      for (i = 0; i < n; i++) {
        acc += entries[i].weight;
        bounds.push((acc / totalWeight) * TAU);
      }
      if (n) bounds[n] = TAU;
    }

    function sliceAt(rot) {
      var n = entries.length;
      if (!n) return -1;
      var a = ((-rot) % TAU + TAU) % TAU;
      var lo = 0, hi = n - 1;
      while (lo < hi) {
        var mid = (lo + hi + 1) >> 1;
        if (bounds[mid] <= a) lo = mid; else hi = mid - 1;
      }
      return lo;
    }

    function trimNum(v) {
      return String(Math.round(v * 1000) / 1000);
    }

    function colorFor(i, n) {
      var c = i % PALETTE.length;
      if (n > 2 && i === n - 1 && c === 0) c = 5;
      return PALETTE[c];
    }

    function syncEntries(redraw) {
      entries = readEntries();
      computeBounds();
      var n = entries.length, weighted = false;
      for (var i = 0; i < n; i++) {
        if (entries[i].weight !== 1) { weighted = true; break; }
      }
      countEl.textContent = n === 1 ? "1 slice" : n + " slices";
      idleOdds = !n ? ""
        : weighted
          ? n + (n === 1 ? " slice" : " slices") + " · " + trimNum(totalWeight) + " total weight"
          : (360 / n).toFixed(1) + "° per slice · 1 in " + n + " odds";
      if (winnerIdx < 0) oddsEl.textContent = idleOdds;
      spinBtn.disabled = spinning || n < 1;
      spinTarget.disabled = spinning || n < 1;
      syncSpinAll();
      if (redraw !== false) draw();
      save();
    }

    function resetVerdict() {
      winnerIdx = -1;
      verdictEl.classList.remove("is-won");
      verdictLabel.textContent = "Ready";
      verdictName.className = "verdict-name is-idle";
      verdictName.textContent = entries.length
        ? "Tap the wheel to pick a winner."
        : "Add a few entries to build the wheel.";
      verdictName.title = "";
      verdictActions.classList.add("is-idle");
      oddsEl.textContent = idleOdds;
    }

    /* ---------- label fitting ---------- */

    var MEASURE_PX = 100;
    var LINE_EM = 1.14;
    var SAFETY = 0.9;

    function unitWidth(s) {
      return ctx.measureText(s).width / MEASURE_PX;
    }

    /* Alone, a picture may grow well past the text cap. */
    var IMG_EM = 1.6;
    var IMG_GAP_EM = 0.3;
    var IMG_ONLY_SCALE = 2.6;

    /* One box, so the slice-fit check covers text and picture together. */
    function measureLabel(lines, img) {
      var uText = 0;
      for (var i = 0; i < lines.length; i++) {
        var u = unitWidth(lines[i]);
        if (u > uText) uText = u;
      }
      var hText = !lines.length ? 0 : lines.length === 1 ? 1 : lines.length * LINE_EM;
      if (!img) return { w: uText, h: hText, imgW: 0, imgH: 0 };
      var imgH = lines.length ? Math.max(IMG_EM, hText) : 1;
      var imgW = imgH * img.aspect;
      return {
        w: uText + imgW + (lines.length ? IMG_GAP_EM : 0),
        h: Math.max(hText, imgH),
        imgW: imgW,
        imgH: imgH
      };
    }

    function sizeForLines(lines, img, seg, outerR, maxW, maxSize) {
      var m = measureLabel(lines, img);
      if (m.w <= 0) return 0;
      var byHeight = (seg * outerR * SAFETY) / (m.h + seg * m.w);
      var byWidth = maxW / m.w;
      var cap = img && !lines.length ? maxSize * IMG_ONLY_SCALE : maxSize;
      return Math.min(byHeight, byWidth, cap);
    }

    function splitInto(words, n) {
      if (words.length < n) return null;
      if (n === 1) return [words.join(" ")];
      var best = null, bestW = Infinity, i, j;
      if (n === 2) {
        for (i = 1; i < words.length; i++) {
          var a = words.slice(0, i).join(" "), b = words.slice(i).join(" ");
          var w = Math.max(unitWidth(a), unitWidth(b));
          if (w < bestW) { bestW = w; best = [a, b]; }
        }
        return best;
      }
      for (i = 1; i < words.length - 1; i++) {
        for (j = i + 1; j < words.length; j++) {
          var p = words.slice(0, i).join(" ");
          var qq = words.slice(i, j).join(" ");
          var r = words.slice(j).join(" ");
          var m = Math.max(unitWidth(p), unitWidth(qq), unitWidth(r));
          if (m < bestW) { bestW = m; best = [p, qq, r]; }
        }
      }
      return best;
    }

    function layoutLabel(text, img, seg, outerR, maxW, maxSize) {
      if (!text) return { lines: [], size: sizeForLines([], img, seg, outerR, maxW, maxSize) };
      var words = text.split(/\s+/).filter(Boolean);
      var best = { lines: [text], size: sizeForLines([text], img, seg, outerR, maxW, maxSize) };
      var maxLines = words.length > 10 ? 2 : 3;
      for (var n = 2; n <= maxLines; n++) {
        var lines = splitInto(words, n);
        if (!lines) break;
        var s = sizeForLines(lines, img, seg, outerR, maxW, maxSize);
        /* Only spend an extra line if it buys a meaningfully bigger face. */
        if (s > best.size * 1.08) best = { lines: lines, size: s };
      }
      return best;
    }

    /* ---------- sizing ---------- */

    function resize() {
      var w = Math.round(wrap.clientWidth);
      if (!w) return;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      size = w;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(w * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    /* ---------- drawing ---------- */

    function draw() {
      if (size < 40) return;
      var n = entries.length;
      var cx = size / 2, cy = size / 2;
      var rim = Math.max(8, size * 0.042);
      var R = size / 2 - rim - 2;
      var hubR = size * 0.115;
      var css = getComputedStyle(document.documentElement);
      var rimA = css.getPropertyValue("--rim-a").trim() || "#F0DCA8";
      var rimB = css.getPropertyValue("--rim-b").trim() || "#A9721B";
      var rimC = css.getPropertyValue("--rim-c").trim() || "#6E4910";

      ctx.clearRect(0, 0, size, size);

      var band = ctx.createLinearGradient(0, 0, size, size);
      band.addColorStop(0, rimA);
      band.addColorStop(0.42, rimB);
      band.addColorStop(1, rimC);
      ctx.beginPath();
      ctx.arc(cx, cy, R + rim / 2, 0, TAU);
      ctx.lineWidth = rim;
      ctx.strokeStyle = band;
      ctx.stroke();

      if (!n) {
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, TAU);
        ctx.fillStyle = css.getPropertyValue("--surface-2").trim() || "#F2F0F8";
        ctx.fill();
        ctx.setLineDash([7, 8]);
        ctx.lineWidth = 2;
        ctx.strokeStyle = css.getPropertyValue("--line").trim() || "#D5D1E2";
        ctx.stroke();
        ctx.setLineDash([]);
        return;
      }

      for (var i = 0; i < n; i++) {
        var a0 = bounds[i] - Math.PI / 2;
        var a1 = bounds[i + 1] - Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, R, a0, a1);
        ctx.closePath();
        ctx.fillStyle = colorFor(i, n);
        ctx.fill();
        if (n <= 60) {
          ctx.lineWidth = 1;
          ctx.strokeStyle = "rgba(0,0,0,.18)";
          ctx.stroke();
        }
      }

      /* The winning slice gets lifted rather than announced twice. */
      if (winnerIdx >= 0 && winnerIdx < n) {
        var w0 = bounds[winnerIdx] - Math.PI / 2;
        var w1 = bounds[winnerIdx + 1] - Math.PI / 2;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, R, w0, w1);
        ctx.closePath();
        ctx.fillStyle = "rgba(255,255,255,.26)";
        ctx.fill();
        ctx.lineWidth = Math.max(2, size * 0.008);
        ctx.strokeStyle = "rgba(255,255,255,.9)";
        ctx.stroke();
        ctx.restore();
      }

      var outerR = R - size * 0.035;
      var innerR = hubR + size * 0.025;
      var maxW = outerR - innerR;
      var maxSize = size * 0.055;

      ctx.font = "600 " + MEASURE_PX + "px Archivo, sans-serif";
      ctx.save();
      ctx.translate(cx, cy);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#FFFFFF";
      for (var j = 0; j < n; j++) {
        var img = imageFor(entries[j].image);
        var lay = layoutLabel(entries[j].label, img, bounds[j + 1] - bounds[j], outerR, maxW, maxSize);
        if (!(lay.size > 0.5)) continue;
        /* Measured while the font is still the measuring size. */
        var box = measureLabel(lay.lines, img);
        var s = lay.size;
        ctx.save();
        ctx.rotate((bounds[j] + bounds[j + 1]) / 2 - Math.PI / 2);
        ctx.font = "600 " + s.toFixed(2) + "px Archivo, sans-serif";
        ctx.shadowColor = "rgba(0,0,0,.42)";
        ctx.shadowBlur = Math.max(2, s * 0.16);
        ctx.shadowOffsetY = Math.max(1, s * 0.05);
        /* Reading runs outward, so a leading picture sits by the hub, a trailing one at the rim. */
        var textRight = outerR;
        if (img) {
          var iw = box.imgW * s, ih = box.imgH * s, ix;
          if (entries[j].imageAfter || !lay.lines.length) {
            ix = outerR - iw;
            textRight = ix - IMG_GAP_EM * s;
          } else {
            ix = outerR - box.w * s;
          }
          ctx.drawImage(img.el, ix, -ih / 2, iw, ih);
        }
        var lh = s * LINE_EM;
        var y = -((lay.lines.length - 1) / 2) * lh;
        for (var k = 0; k < lay.lines.length; k++) {
          ctx.fillText(lay.lines[k], textRight, y + k * lh);
        }
        ctx.restore();
      }
      ctx.restore();

      /* Pegs sit on the boundaries so the flapper has something to hit. */
      var pegs = n <= 60 ? n : 0;
      for (var p = 0; p < pegs; p++) {
        var pa = bounds[p] - Math.PI / 2;
        var pr = R + rim / 2;
        var px = cx + Math.cos(pa) * pr;
        var py = cy + Math.sin(pa) * pr;
        var pRad = Math.max(1.6, rim * 0.21);
        ctx.beginPath();
        ctx.arc(px, py, pRad, 0, TAU);
        ctx.fillStyle = rimA;
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = rimC;
        ctx.stroke();
      }

      /* Backs the DOM hub so slice tips never show around it. */
      ctx.beginPath();
      ctx.arc(cx, cy, hubR, 0, TAU);
      ctx.fillStyle = css.getPropertyValue("--hub-face").trim() || "#FBF8F1";
      ctx.fill();
    }

    /* ---------- spinning ---------- */

    function setSpinning(on) {
      spinning = on;
      spinBtn.disabled = on || entries.length < 1;
      spinTarget.disabled = on || entries.length < 1;
      clearBtn.disabled = on;
      againBtn.disabled = on;
      removeBtn.disabled = on;
      removeWheelBtn.disabled = on;
      entriesEl.readOnly = on;
      spinBtn.textContent = on ? "Spinning…" : "Spin the wheel";
      syncSpinAll();
    }

    /* Each wheel joins a chain once, so "A!B" and "B!A" can't loop. */
    function spin() { startSpin([]); }

    function startSpin(chain) {
      if (spinning || chain.indexOf(api) >= 0) return;
      var trail = chain.concat([api]);
      syncEntries(false);
      var n = entries.length;
      if (!n) { resetVerdict(); draw(); return; }

      setSpinning(true);
      winnerIdx = -1;
      verdictEl.classList.remove("is-won");
      verdictLabel.textContent = "Spinning";
      verdictName.className = "verdict-name is-idle";
      verdictName.textContent = "…";
      verdictName.title = "";
      verdictActions.classList.add("is-idle");
      draw();

      var reduced = reduceMotion.matches;
      var r = Math.random() * totalWeight;
      var acc = 0, winner = n - 1;
      for (var i = 0; i < n; i++) {
        acc += entries[i].weight;
        if (r < acc) { winner = i; break; }
      }
      /* Land inside the slice, never on a peg. */
      var span = bounds[winner + 1] - bounds[winner];
      var aim = bounds[winner] + (0.18 + 0.64 * Math.random()) * span;
      var base = ((-aim) % TAU + TAU) % TAU;
      var turns = reduced ? 0 : 4 + Math.floor(Math.random() * 4);
      var target = base;
      while (target < theta + turns * TAU + 0.0001) target += TAU;

      var start = theta;
      var delta = target - start;
      var dur = reduced ? 650 : 4400 + Math.random() * 1600;
      var t0 = performance.now();
      var lastSlice = sliceAt(start);

      function frame(now) {
        var t = Math.min(1, (now - t0) / dur);
        var eased = 1 - Math.pow(1 - t, 4.2);
        theta = start + delta * eased;

        var slice = sliceAt(theta);
        if (slice !== lastSlice) {
          lastSlice = slice;
          if (!reduced) { click(); flap = -11; }
        }
        flap += (0 - flap) * 0.28;

        canvas.style.transform = "rotate(" + theta + "rad)";
        pointerEl.style.transform = reduced ? "" : "rotate(" + flap.toFixed(2) + "deg)";

        if (t < 1) { requestAnimationFrame(frame); }
        else {
          theta = ((target % TAU) + TAU) % TAU;
          canvas.style.transform = "rotate(" + theta + "rad)";
          pointerEl.style.transform = "";
          finish(winner, trail);
        }
      }
      requestAnimationFrame(frame);
    }

    function finish(idx, trail) {
      /* Chime first, while this wheel still counts toward the volume scaling. */
      chime();
      setSpinning(false);
      winnerIdx = idx;
      draw();

      var entry = entries[idx];
      var name = entry.label;
      var share = entry.weight / totalWeight;
      verdictEl.classList.add("is-won");
      verdictLabel.textContent = "Winner";
      verdictName.className = "verdict-name";
      verdictName.textContent = name;
      verdictName.title = name;
      if (entry.image) {
        var pic = makeThumb(entry.image, "verdict-img", !name);
        if (!name) pic.classList.add("is-alone");
        else pic.classList.add(entry.imageAfter ? "is-after" : "is-before");
        if (entry.imageAfter) verdictName.appendChild(pic);
        else verdictName.insertBefore(pic, verdictName.firstChild);
      }
      verdictActions.classList.remove("is-idle");

      var odds = (share * 100).toFixed(1) + "% chance · " +
        (share * 360).toFixed(1) + "° slice";
      var next = entry.trigger ? wheelByName(entry.trigger) : null;
      if (next && trail.indexOf(next) < 0) {
        odds += " · spins " + next.displayName();
        /* Pause to read the winner; re-resolve, as the board may change meanwhile. */
        var target = entry.trigger;
        setTimeout(function () {
          var w = wheelByName(target);
          if (!w || trail.indexOf(w) >= 0) return;
          setActive(w);
          w.spinFrom(trail);
        }, reduceMotion.matches ? 0 : 600);
      }
      oddsEl.textContent = odds;

      addLog(displayName(), name, entry.image);
      save();
    }

    /* ---------- events ---------- */

    function activate() { setActive(api); }

    card.addEventListener("focusin", activate);
    card.addEventListener("pointerdown", activate);
    listCard.addEventListener("focusin", activate);
    listCard.addEventListener("pointerdown", activate);

    spinTarget.addEventListener("click", spin);
    spinBtn.addEventListener("click", spin);
    againBtn.addEventListener("click", spin);

    removeBtn.addEventListener("click", function () {
      if (spinning || winnerIdx < 0) return;
      var entry = entries[winnerIdx];
      if (!entry) return;
      var lines = entriesEl.value.split("\n");
      if (entry.line < lines.length) lines.splice(entry.line, 1);
      entriesEl.value = lines.join("\n").replace(/^\n+/, "");
      claimBoard();
      resetVerdict();
      syncEntries();
      entriesEl.focus();
    });

    clearBtn.addEventListener("click", function () {
      if (spinning) return;
      entriesEl.value = "";
      claimBoard();
      setHint("");
      resetVerdict();
      syncEntries();
      entriesEl.focus();
    });

    entriesEl.addEventListener("input", function () {
      claimBoard();
      setHint("");
      if (winnerIdx >= 0) resetVerdict();
      syncEntries();
    });

    removeWheelBtn.addEventListener("click", function () {
      if (spinning) return;
      removeWheel(api);
    });

    /* Placeholder holds the default name, so clearing the field restores it. */
    function displayName() {
      return nameEl.value.trim() || nameEl.placeholder;
    }

    /* On a board, lists are labelled by wheel; alone, by how to fill them. */
    function syncName() {
      var multi = wheels.length > 1;
      removeWheelBtn.setAttribute("aria-label", "Remove " + displayName());
      spinTarget.setAttribute("aria-label", multi ? "Spin " + displayName() : "Spin the wheel");
      listLabel.textContent = multi ? displayName() : "Entries — one per line";
    }

    nameEl.addEventListener("input", function () {
      claimBoard();
      syncName();
      save();
    });

    /* On settle, not per keystroke: resyncAll redraws every wheel. */
    nameEl.addEventListener("change", function () {
      nameEl.value = cleanName(nameEl.value);
      syncName();
      resyncAll();
    });

    nameEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === "Escape") {
        nameEl.blur();
        e.preventDefault();
        e.stopPropagation();
      }
    });

    helpBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      setHelp(helpPop.hidden);
    });

    function setHelp(open) {
      helpPop.hidden = !open;
      helpBtn.setAttribute("aria-expanded", open ? "true" : "false");
    }

    function setHint(msg) {
      hintEl.textContent = msg || "";
      hintEl.hidden = !msg;
    }

    var ro = null;
    if (window.ResizeObserver) {
      ro = new ResizeObserver(resize);
      ro.observe(wrap);
    }

    var api = {
      el: card,
      listEl: listCard,
      spin: spin,
      spinFrom: startSpin,
      displayName: displayName,
      resync: function () { syncEntries(true); },
      draw: draw,
      resize: resize,
      rawLines: rawLines,
      setHint: setHint,
      isSpinning: function () { return spinning; },
      canSpin: function () { return !spinning && entries.length > 0; },
      init: function () { syncEntries(false); resetVerdict(); syncName(); },
      getName: function () { return cleanName(nameEl.value); },
      serialize: function () {
        return {
          text: entriesEl.value,
          name: cleanName(nameEl.value)
        };
      },
      setOrdinal: function (i) {
        nameEl.placeholder = "Wheel " + i;
        nameEl.setAttribute("aria-label", "Name of wheel " + i);
        syncName();
      },
      focusEntries: function () { entriesEl.focus(); },
      destroy: function () {
        if (ro) ro.disconnect();
        if (card.parentNode) card.parentNode.removeChild(card);
        if (listCard.parentNode) listCard.parentNode.removeChild(listCard);
      }
    };

    /* The rest waits for api.init(), once addWheel has mounted the card. */
    return api;
  }

  /* ---------- board management ---------- */

  function setActive(wheel) {
    if (activeWheel === wheel) return;
    if (activeWheel) {
      activeWheel.el.classList.remove("is-active");
      activeWheel.listEl.classList.remove("is-active");
    }
    activeWheel = wheel;
    if (activeWheel) {
      activeWheel.el.classList.add("is-active");
      activeWheel.listEl.classList.add("is-active");
    }
  }

  function renumber() {
    for (var i = 0; i < wheels.length; i++) wheels[i].setOrdinal(i + 1);
  }

  function syncChrome() {
    var n = wheels.length;
    addWheelBtn.disabled = n >= MAX_WHEELS;
    spinAllBtn.hidden = n < 2;
    panelToggleLabel.textContent = (panelOpen ? "Hide list" : "Show list") + (n > 1 ? "s" : "");
    syncSpinAll();
    renderLog();
  }

  function syncSpinAll() {
    if (spinAllBtn.hidden) return;
    var any = false;
    for (var i = 0; i < wheels.length; i++) {
      if (wheels[i].canSpin()) { any = true; break; }
    }
    spinAllBtn.disabled = !any;
  }

  function addWheel(init, quiet) {
    if (wheels.length >= MAX_WHEELS) return null;
    var wheel = createWheel(init);
    wheels.push(wheel);
    wheelsEl.appendChild(wheel.el);
    listsEl.appendChild(wheel.listEl);
    wheel.init();
    renumber();
    resyncAll();
    syncChrome();
    if (!activeWheel) setActive(wheel);
    if (!quiet) {
      setActive(wheel);
      relayout();
      save();
      wheel.focusEntries();
    }
    return wheel;
  }

  function removeWheel(wheel) {
    var i = wheels.indexOf(wheel);
    if (i < 0) return;
    claimBoard();
    wheels.splice(i, 1);
    wheel.destroy();
    if (activeWheel === wheel) {
      activeWheel = null;
      setActive(wheels[Math.min(i, wheels.length - 1)] || null);
    }
    /* Never empty: removing the last one leaves a blank wheel to type into. */
    if (!wheels.length) addWheel({ text: "", name: "" }, true);
    renumber();
    resyncAll();
    syncChrome();
    relayout();
    save();
  }

  function setPanel(open) {
    panelOpen = open;
    boardEl.classList.toggle("is-collapsed", !open);
    panelToggle.setAttribute("aria-expanded", open ? "true" : "false");
    syncChrome();
    requestAnimationFrame(relayout);
  }

  function setSound(on) {
    soundOn = on;
    soundBtn.setAttribute("aria-pressed", on ? "true" : "false");
  }

  /* ---------- board title ---------- */

  /* A named board replaces both the app title and the tagline. */
  function renderTitle() {
    titleText.textContent = "";
    if (boardTitle) {
      titleText.appendChild(document.createTextNode(boardTitle));
    } else {
      var em = document.createElement("em");
      em.textContent = "Win";
      titleText.appendChild(document.createTextNode("Spin to "));
      titleText.appendChild(em);
    }
    document.title = boardTitle || "Spin to Win";
    taglineEl.hidden = !!boardTitle;
  }

  var titleEditing = false;

  function openTitle() {
    titleInput.value = boardTitle;
    titleEditing = true;
    titleBtn.hidden = true;
    titleInput.hidden = false;
    titleInput.focus();
    titleInput.select();
  }

  /* Hiding the input fires blur, so the guard stops that undoing Escape. */
  function closeTitle(commit, refocus) {
    if (!titleEditing) return;
    titleEditing = false;
    if (commit) {
      var next = cleanName(titleInput.value);
      if (next !== boardTitle) {
        boardTitle = next;
        claimBoard();
        renderTitle();
        /* The tagline's height was part of the wheels' budget. */
        relayout();
        save();
      }
    }
    titleInput.hidden = true;
    titleBtn.hidden = false;
    if (refocus) titleBtn.focus();
  }

  titleBtn.addEventListener("click", openTitle);
  titleInput.addEventListener("blur", function () { closeTitle(true, false); });
  titleInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { closeTitle(true, true); e.preventDefault(); e.stopPropagation(); }
    else if (e.key === "Escape") { closeTitle(false, true); e.preventDefault(); e.stopPropagation(); }
  });

  /* ---------- header ---------- */

  addWheelBtn.addEventListener("click", function () {
    claimBoard();
    var wheel = addWheel({ text: "", name: "" });
    if (wheel) wheel.setHint("Empty wheel — type some entries.");
  });

  spinAllBtn.addEventListener("click", function () {
    for (var i = 0; i < wheels.length; i++) wheels[i].spin();
  });

  panelToggle.addEventListener("click", function () {
    setPanel(!panelOpen);
    storedPanel = panelOpen;
    save();
  });

  soundBtn.addEventListener("click", function () {
    setSound(!soundOn);
    save();
  });

  function copyFallback(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:-9999px";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function embedUrl() {
    var url = shareUrl();
    return url + (url.indexOf("?") < 0 ? "?" : "&") + "view=min";
  }

  /* Returns a refresh, for labels that change while idle. */
  function copyButton(btn, label, makeUrl, idleText) {
    var timer = 0;
    function idle() {
      timer = 0;
      label.textContent = idleText();
    }
    function flash(msg) {
      label.textContent = msg;
      clearTimeout(timer);
      timer = setTimeout(idle, 1800);
    }
    btn.addEventListener("click", function (e) {
      var url = makeUrl(e);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(
          function () { flash("Link copied"); },
          function () { flash(copyFallback(url) ? "Link copied" : "Copy failed"); }
        );
      } else {
        flash(copyFallback(url) ? "Link copied" : "Copy failed");
      }
    });
    return function () { if (!timer) idle(); };
  }

  /* Shift turns Copy link into Copy embed, without a trip into minimal view. */
  var shiftHeld = false;
  var refreshCopy = copyButton(copyBtn, copyLabel,
    function (e) { return e.shiftKey ? embedUrl() : shareUrl(); },
    function () { return shiftHeld ? "Copy embed" : "Copy link"; });
  copyButton(embedCopy, embedLabel, embedUrl, function () { return "Copy embed link"; });

  function setShift(on) {
    if (shiftHeld === on) return;
    shiftHeld = on;
    refreshCopy();
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Shift") setShift(true); });
  document.addEventListener("keyup", function (e) { if (e.key === "Shift") setShift(false); });
  /* Shift let go in another window never sends its keyup here. */
  window.addEventListener("blur", function () { setShift(false); });
  copyBtn.addEventListener("pointerenter", function (e) { setShift(e.shiftKey); });

  /* ---------- minimal view ---------- */

  var minimal = false;
  var peekTimer = 0;

  function setMinimal(on) {
    if (minimal === on) return;
    minimal = on;
    document.documentElement.classList.toggle("is-minimal", on);
    clearTimeout(peekTimer);
    minBar.classList.remove("is-peek");
    closeHelps();
    relayout();
  }

  function enterMinimal() {
    setMinimal(true);
    /* A glimpse of the way out; after that it waits for a hover. */
    minBar.classList.add("is-peek");
    peekTimer = setTimeout(function () { minBar.classList.remove("is-peek"); }, 2500);
  }

  function exitMinimal() {
    setMinimal(false);
    minimalBtn.focus();
  }

  minimalBtn.addEventListener("click", enterMinimal);
  minExit.addEventListener("click", exitMinimal);

  /* ---------- global keys and popovers ---------- */

  function closeHelps(keep) {
    var pops = document.querySelectorAll(".help-pop:not([hidden])");
    for (var i = 0; i < pops.length; i++) {
      if (keep && pops[i].contains(keep)) continue;
      pops[i].hidden = true;
      var btn = pops[i].parentNode.querySelector(".info-btn");
      if (btn) btn.setAttribute("aria-expanded", "false");
    }
  }

  document.addEventListener("click", function (e) {
    closeHelps(e.target);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && document.querySelector(".help-pop:not([hidden])")) {
      closeHelps();
      return;
    }
    if (e.key === "Escape" && minimal) {
      exitMinimal();
      return;
    }
    if (e.code === "Space") {
      var el = document.activeElement;
      /* Space belongs to whatever is focused if that thing uses it. */
      if (el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT" ||
                 el.tagName === "BUTTON" || el.isContentEditable)) return;
      if (activeWheel) {
        activeWheel.spin();
        e.preventDefault();
      }
    }
  });

  window.addEventListener("resize", relayout);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      relayout();
    });
  }

  /* ---------- boot ---------- */

  (function boot() {
    shadow = loadState();
    if (shadow && typeof shadow.sound === "boolean") soundOn = shadow.sound;
    if (shadow && typeof shadow.panel === "boolean") panelOpen = shadow.panel;
    storedPanel = panelOpen;
    if (shadow && typeof shadow.title === "string") boardTitle = cleanName(shadow.title);
    log = readLog(shadow);

    var shared = boardFromLink();
    var i, init = [];

    if (shared) {
      boardFromUrl = true;
      /* A shared board opens as a board, not as a page of textareas. */
      panelOpen = false;
      boardTitle = shared.title;
      for (i = 0; i < shared.wheels.length; i++) {
        init.push({
          text: shared.wheels[i].list.join("\n"),
          name: shared.wheels[i].name
        });
      }
    } else if (shadow && shadow.wheels.length) {
      for (i = 0; i < shadow.wheels.length && i < MAX_WHEELS; i++) {
        var w = shadow.wheels[i] || {};
        init.push({
          text: typeof w.text === "string" ? w.text : "",
          name: typeof w.name === "string" ? w.name : ""
        });
      }
      /* A saved board of nothing but blanks is the same as no board. */
      var anyContent = false;
      for (i = 0; i < init.length; i++) {
        if (init[i].text.trim() || init[i].name) anyContent = true;
      }
      if (!anyContent && init.length === 1) init = [];
    }

    var sampled = false;
    if (!init.length) {
      init = [{ text: SAMPLE.join("\n"), name: "" }];
      sampled = true;
    }

    setSound(soundOn);
    renderTitle();
    for (i = 0; i < init.length; i++) addWheel(init[i], true);
    setActive(wheels[0]);

    if (boardFromUrl) {
      var msg = wheels.length > 1
        ? "Board loaded from the link. Editing it makes it yours."
        : "List loaded from the link. Editing it makes it yours.";
      for (i = 0; i < wheels.length; i++) wheels[i].setHint(msg);
    } else if (sampled) {
      wheels[0].setHint("Sample list loaded — replace it with your own names.");
    }

    setPanel(panelOpen);
    syncChrome();

    /* No peek: an embed should show the wheels and nothing else. */
    var view = null;
    try { view = new URLSearchParams(queryString()).get("view"); } catch (e) { /* no view */ }
    if (view === "min") {
      document.documentElement.classList.add("is-embed");
      setMinimal(true);
    }
    relayout();
  })();
})();
</script>
