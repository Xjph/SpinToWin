<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin to Win</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root {
    --ground:      #E9E7F0;
    --surface:     #FCFBFE;
    --surface-2:   #F2F0F8;
    --ink:         #1A1726;
    --ink-soft:    #5C5670;
    --line:        #D5D1E2;
    --brass:       #A9721B;
    --brass-lit:   #D9A644;
    --brass-dim:   #E4D3AE;
    --shadow:      rgba(26, 23, 38, .16);
    --shadow-deep: rgba(26, 23, 38, .24);
    --rim-a:       #F0DCA8;
    --rim-b:       #A9721B;
    --rim-c:       #6E4910;
    --hub-face:    #FBF8F1;

    --display: "Alfa Slab One", "Rockwell", Georgia, serif;
    --ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --mono: "Space Mono", "SFMono-Regular", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:      #131120;
      --surface:     #1D1A2B;
      --surface-2:   #262235;
      --ink:         #EFECF7;
      --ink-soft:    #9C95B0;
      --line:        #353047;
      --brass:       #E4AC4E;
      --brass-lit:   #F5D590;
      --brass-dim:   #6B4E1C;
      --shadow:      rgba(0, 0, 0, .45);
      --shadow-deep: rgba(0, 0, 0, .6);
      --rim-a:       #F5D590;
      --rim-b:       #B07E23;
      --rim-c:       #503309;
      --hub-face:    #2B2539;
    }
  }

  :root[data-theme="dark"] {
    --ground:      #131120;
    --surface:     #1D1A2B;
    --surface-2:   #262235;
    --ink:         #EFECF7;
    --ink-soft:    #9C95B0;
    --line:        #353047;
    --brass:       #E4AC4E;
    --brass-lit:   #F5D590;
    --brass-dim:   #6B4E1C;
    --shadow:      rgba(0, 0, 0, .45);
    --shadow-deep: rgba(0, 0, 0, .6);
    --rim-a:       #F5D590;
    --rim-b:       #B07E23;
    --rim-c:       #503309;
    --hub-face:    #2B2539;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 400 15px/1.55 var(--ui);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: clamp(1080px, calc(100vh + 480px), 2400px);
    max-width: clamp(1080px, calc(100dvh + 480px), 2400px);
    margin: 0 auto;
    padding-inline: 20px;
    padding-block: 26px 30px;
  }

  /* ---------- masthead ---------- */

  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 18px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--brass);
    margin-bottom: 28px;
  }

  .wordmark {
    font: 400 clamp(1.75rem, 5vw, 2.4rem)/1 var(--display);
    margin: 0;
    letter-spacing: -.015em;
    /* The board's name is one line, whole, always: nowrap stops it
       breaking, and leaving min-width at auto stops the masthead
       shrinking it below that line. Long names push the buttons onto
       the next row instead. */
    white-space: nowrap;
  }
  .wordmark em {
    font-style: normal;
    color: var(--brass);
  }

  /* The masthead reads as a heading but edits like a field. */
  .wordmark-btn,
  .wordmark-input {
    font: inherit;
    letter-spacing: inherit;
    padding: 3px 9px;
    margin-left: -10px;
    border: 1px solid transparent;
    border-radius: 4px;
  }
  .wordmark-btn {
    display: block;
    background: none;
    color: inherit;
    text-align: left;
    cursor: text;
    transition: border-color .15s ease;
  }
  .wordmark-btn:hover { border-color: var(--line); }
  .wordmark-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .wordmark-input {
    width: 15ch;
    max-width: 100%;
    border-color: var(--brass);
    background: var(--surface);
    color: var(--ink);
  }
  .wordmark-input:focus { outline: none; }
  .wordmark-input[hidden],
  .wordmark-btn[hidden] { display: none; }

  .tagline[hidden] { display: none; }

  .tagline {
    margin: 0;
    color: var(--ink-soft);
    font-size: .95rem;
    max-width: 44ch;
  }

  .links {
    margin-left: auto;
    font: 400 10px/1 var(--mono)
  }

  .header-actions {
    align-self: center;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .header-button {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 9px 13px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--surface);
    color: var(--ink-soft);
    font: 400 11px/1 var(--mono);
    letter-spacing: .14em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: color .15s ease, border-color .15s ease;
  }
  .header-button:hover { color: var(--brass); border-color: var(--brass); }
  .header-button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .header-button[disabled] { opacity: .45; cursor: default; }
  .header-button[disabled]:hover { color: var(--ink-soft); border-color: var(--line); }
  .header-button[hidden] { display: none; }
  .header-button svg {
    width: 13px;
    height: 13px;
    flex: none;
  }
  .header-button.icon-only { padding: 9px; }
  .header-button.icon-only svg { width: 15px; height: 15px; }

  #panelToggle svg { transition: transform .2s ease; }
  #panelToggle[aria-expanded="false"] svg { transform: rotate(180deg); }

  #soundToggle .slash { display: none; }
  #soundToggle[aria-pressed="false"] .wave { display: none; }
  #soundToggle[aria-pressed="false"] .slash { display: block; }

  /* ---------- board ---------- */

  .board {
    display: grid;
    grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr));
    gap: 34px;
    align-items: start;
  }

  .wheel-card { container-type: inline-size; }

  .board.is-multi .wheel-card {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 18px 20px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .board.is-multi .wheel-card.is-active {
    border-color: var(--brass);
    box-shadow: 0 2px 14px var(--shadow);
  }

  /* A lone wheel needs no title bar — the board's own name covers it. */
  .card-head { display: none; }
  .board.is-multi .card-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 9px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }

  /* A plain label until you click it, an input the whole time. */
  .card-name {
    flex: 1 1 auto;
    min-width: 0;
    padding: 4px 6px;
    margin-left: -7px;
    border: 1px solid transparent;
    border-radius: 3px;
    background: transparent;
    color: var(--ink-soft);
    font: 400 10px/1.4 var(--mono);
    letter-spacing: .2em;
    text-transform: uppercase;
    text-overflow: ellipsis;
    cursor: text;
    transition: border-color .15s ease, background .15s ease;
  }
  .card-name::placeholder { color: var(--ink-soft); opacity: .8; }
  .card-name:hover { border-color: var(--line); }
  .card-name:focus {
    outline: none;
    border-color: var(--brass);
    background: var(--surface);
    color: var(--ink);
  }
  .wheel-card.is-active .card-name { color: var(--brass); }
  .wheel-card.is-active .card-name:focus { color: var(--ink); }

  .card-remove {
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    flex: none;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .card-remove:hover { color: var(--brass); border-color: var(--brass); }
  .card-remove:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .card-remove[disabled] { opacity: .45; cursor: default; }
  .card-remove svg { display: block; width: 12px; height: 12px; }

  .card-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 30px;
    align-items: start;
  }

  /* A card wide enough for both puts the list beside the wheel; a narrow
     one — which is what tiling several wheels produces — stacks it under. */
  @container (min-width: 780px) {
    .board:not(.is-collapsed) .card-grid { grid-template-columns: minmax(0, 1fr) 320px; gap: 36px; }
  }

  .board.is-collapsed .panel { display: none; }

  @container (min-width: 820px) {
    .board.is-collapsed .stage {
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }
    .board.is-collapsed .verdict {
      width: 300px;
      flex: 0 0 300px;
    }
  }

  /* ---------- stage ---------- */

  .stage {
    --wheel-w: max(260px, min(100%, calc(100vh - 340px)));
    --wheel-w: max(260px, min(100%, calc(100dvh - 340px)));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .wheel-wrap {
    position: relative;
    width: var(--wheel-w);
    aspect-ratio: 1;
    container-type: inline-size;
  }

  .wheel-canvas {
    display: block;
    width: 100%;
    height: 100%;
    max-width: 100%;
    filter: drop-shadow(0 10px 22px var(--shadow));
    will-change: transform;
  }

  .spin-target {
    position: absolute;
    inset: 0;
    border: 0;
    padding: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    z-index: 3;
  }
  .spin-target:focus-visible {
    outline: 3px solid var(--brass);
    outline-offset: 5px;
  }
  .spin-target[disabled] { cursor: default; }

  .hub {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 23%;
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 34% 28%, var(--rim-a), var(--rim-b) 62%, var(--rim-c) 100%);
    box-shadow:
      0 0 0 3px var(--hub-face),
      0 4px 12px var(--shadow-deep),
      inset 0 -3px 6px rgba(0, 0, 0, .3);
    display: grid;
    place-items: center;
    z-index: 2;
    pointer-events: none;
    transition: transform .18s ease;
  }
  .spin-target:hover + .hub { transform: translate(-50%, -50%) scale(1.06); }
  .spin-target[disabled] + .hub { transform: translate(-50%, -50%) scale(.95); }

  .hub span {
    font: 700 clamp(9px, 4cqw, 20px)/1 var(--mono);
    letter-spacing: .14em;
    color: #2E1D04;
    text-transform: uppercase;
  }

  .pointer {
    position: absolute;
    left: 50%;
    top: -2.2%;
    width: 12%;
    margin-left: -6%;
    transform-origin: 50% 14%;
    z-index: 4;
    pointer-events: none;
    filter: drop-shadow(0 3px 5px var(--shadow-deep));
  }
  .pointer svg { display: block; width: 100%; height: auto; }

  /* ---------- verdict ---------- */

  .verdict {
    width: var(--wheel-w);
    min-height: 152px;
    border: 1px solid var(--line);
    border-top: 3px solid var(--brass);
    border-radius: 3px;
    background: var(--surface);
    box-shadow: 0 2px 10px var(--shadow);
    padding: 16px 20px 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 10px;
    text-align: center;
  }

  .verdict-label {
    font: 400 10px/1 var(--mono);
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .verdict-name {
    font: 400 clamp(1.4rem, 4.6vw, 2rem)/1.15 var(--display);
    margin: 0;
    color: var(--ink);
    overflow-wrap: anywhere;
    text-wrap: balance;
    min-height: calc(clamp(1.4rem, 4.6vw, 2rem) * 1.15);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .verdict-name.is-idle {
    font-family: var(--ui);
    font-weight: 500;
    font-size: 1rem;
    color: var(--ink-soft);
  }
  .verdict.is-won .verdict-name { animation: pop .42s cubic-bezier(.2, 1.5, .4, 1); }

  @keyframes pop {
    from { transform: scale(.82); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  .verdict-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .verdict-actions.is-idle { visibility: hidden; }

  .odds {
    font: 400 11px/1.4 var(--mono);
    color: var(--ink-soft);
    letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- panel ---------- */

  .panel {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .field-head {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
    font: 400 10px/1 var(--mono);
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .field-meta {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .field-meta b {
    font-weight: 700;
    color: var(--brass);
    font-variant-numeric: tabular-nums;
    letter-spacing: .08em;
  }

  .info-btn {
    display: grid;
    place-items: center;
    width: 20px;
    height: 20px;
    flex: none;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .info-btn:hover,
  .info-btn[aria-expanded="true"] { color: var(--brass); border-color: var(--brass); }
  .info-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .info-btn svg { display: block; width: 13px; height: 13px; }

  .help-pop {
    position: absolute;
    top: calc(100% + 9px);
    right: 0;
    z-index: 5;
    width: min(330px, 100%);
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-top: 3px solid var(--brass);
    border-radius: 3px;
    background: var(--surface);
    box-shadow: 0 10px 28px var(--shadow-deep);
    font: 400 13px/1.6 var(--ui);
    letter-spacing: normal;
    text-transform: none;
    color: var(--ink-soft);
  }
  .help-pop[hidden] { display: none; }
  .help-pop p { margin: 0 0 9px; }
  .help-pop p:last-child { margin-bottom: 0; }

  .entries {
    width: 100%;
    min-height: 210px;
    resize: vertical;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--surface);
    color: var(--ink);
    font: 400 13px/1.85 var(--mono);
    box-shadow: inset 0 1px 3px var(--shadow);
  }
  .entries:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 1px;
    border-color: var(--brass);
  }

  .hint {
    margin: 8px 0 0;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .hint[hidden] { display: none; }

  .hint code,
  .help-pop code {
    font: 400 12px/1.5 var(--mono);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 1px 4px;
    color: var(--ink);
    white-space: nowrap;
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  button.act {
    font: 500 13px/1 var(--ui);
    padding: 9px 14px;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  button.act:hover { background: var(--surface); border-color: var(--brass); }
  button.act:active { transform: translateY(1px); }
  button.act:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  button.act[disabled] { opacity: .45; cursor: default; }
  button.act[disabled]:hover { background: var(--surface-2); border-color: var(--line); }

  button.act.primary {
    background: var(--brass);
    border-color: var(--brass);
    color: #231703;
    font-weight: 600;
  }
  button.act.primary:hover { background: var(--brass-lit); border-color: var(--brass-lit); }

  .history-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 7px;
    margin-bottom: 4px;
  }
  .history-head h2 {
    font: 400 10px/1 var(--mono);
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0;
  }
  .link-btn {
    background: none;
    border: 0;
    padding: 2px 0;
    font: 400 11px/1 var(--mono);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .link-btn:hover { color: var(--brass); }
  .link-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .history {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    max-height: 210px;
    overflow-y: auto;
  }
  .history li {
    display: grid;
    grid-template-columns: 2.6em 1fr;
    gap: 10px;
    align-items: baseline;
    padding: 7px 2px;
    border-bottom: 1px dotted var(--line);
    font-size: 14px;
  }
  .history li:last-child { border-bottom: 0; }
  .history .n {
    font: 400 11px/1.5 var(--mono);
    color: var(--brass);
    font-variant-numeric: tabular-nums;
  }
  .history .who { overflow-wrap: anywhere; }
  .history-empty {
    margin: 10px 0 0;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .external-link {
    color: var(--ink-soft)
  }

  .external-link:hover {
    color: var(--ink)
  }

  @media (prefers-reduced-motion: reduce) {
    .verdict.is-won .verdict-name { animation: none; }
    .hub, button.act, .wheel-card { transition: none; }
  }
</style>

<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <linearGradient id="brassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6E3B4"></stop>
      <stop offset="45%" stop-color="#D9A644"></stop>
      <stop offset="100%" stop-color="#8A5C11"></stop>
    </linearGradient>
  </defs>
</svg>

<div class="page">
  <header class="masthead">
    <h1 class="wordmark">
      <button class="wordmark-btn" id="titleBtn" type="button" title="Click to rename this board">
        <span id="titleText">Spin to <em>Win</em></span>
      </button>
      <input class="wordmark-input" id="titleInput" type="text" maxlength="40"
             spellcheck="false" autocomplete="off" aria-label="Board name" hidden>
    </h1>
    <p class="tagline" id="tagline">Type a list, give the wheel a shove, let the flapper decide.</p>
    <div class="links">
        <a class="external-link" href="https://github.com/Xjph/SpinToWin">github</a> - <a class="external-link" href="https://ko-fi.com/vithigar">ko-fi</a>
    </div>
    <div class="header-actions">
      <button class="header-button icon-only" id="soundToggle" type="button" aria-pressed="true" aria-label="Peg clicks and winner chime">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8.6 2.4 L4.9 5.5 H2.2 v5 H4.9 l3.7 3.1 z" fill="currentColor"></path>
          <path class="wave" d="M11 5.6 a3.4 3.4 0 0 1 0 4.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
          <path class="slash" d="M11 5.6 L14.6 10.4 M14.6 5.6 L11 10.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
        </svg>
      </button>
      <button class="header-button" id="copyBtn" type="button"><span id="copyLabel">Copy link</span></button>
      <button class="header-button" id="addWheel" type="button">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 3 V13 M3 8 H13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
        Add wheel
      </button>
      <button class="header-button" id="spinAll" type="button" hidden>Spin all</button>
      <button class="header-button" id="panelToggle" type="button" aria-expanded="true" aria-controls="board">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M6 3 L11 8 L6 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span id="panelToggleLabel">Hide list</span>
      </button>
    </div>
  </header>

  <div class="board" id="board"></div>
</div>

<template id="wheelTpl">

              <p>Decimals can also be used: <code>0.5#Green</code>.</p>
              <p>Zero weight items, like <code>0#Maybe</code>, are omitted from the wheel.</p>
              <p>End an entry with <code>!</code> and a wheel's name to spin that wheel when the entry wins: <code>Coffee!Snacks</code>.</p>

<script>
(function () {
  "use strict";

  var TAU = Math.PI * 2;

  var PALETTE = [
    "#C4382C", "#2E7D74", "#B06C18", "#4C4A96", "#4E8442",
    "#A32F63", "#2A6A9E", "#8C5220", "#6E3D96", "#77761F"
  ];

  var SAMPLE = ["Apples", "Oranges", "2#Bananas", "0.5#Pears"];
  var STORE_KEY = "spin-to-win/v2";
  var LEGACY_KEY = "spin-to-win/v1";
  var MAX_ENTRIES = 300;
  var MAX_WHEELS = 8;
  var MAX_NAME = 40;
  var GRID_GAP = 34;

  var boardEl = document.getElementById("board");
  var tpl = document.getElementById("wheelTpl");
  var pageEl = document.querySelector(".page");
  var mastheadEl = document.querySelector(".masthead");
  var panelToggle = document.getElementById("panelToggle");
  var panelToggleLabel = document.getElementById("panelToggleLabel");
  var addWheelBtn = document.getElementById("addWheel");
  var spinAllBtn = document.getElementById("spinAll");
  var copyBtn = document.getElementById("copyBtn");
  var copyLabel = document.getElementById("copyLabel");
  var soundBtn = document.getElementById("soundToggle");
  var titleBtn = document.getElementById("titleBtn");
  var titleText = document.getElementById("titleText");
  var titleInput = document.getElementById("titleInput");
  var taglineEl = document.getElementById("tagline");

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  var wheels = [];
  var wheelSeq = 0;
  var activeWheel = null;
  var panelOpen = true;
  var soundOn = true;
  var boardTitle = "";

  /* A list arriving by link is shown, but the saved board is held in
     reserve until the visitor edits something — opening a link is never
     a way to lose the lists you had. */
  var boardFromUrl = false;
  var shadow = null;

  /* ---------- link payload ----------
     Copy link emits ?w=<base64url> per wheel, so the lists aren't legible
     in the address bar before anyone opens them. The bytes are a format
     flag (0 raw UTF-8, 1 LZW) followed by the list text, LZW'd whenever
     that comes out smaller. */

  var B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
  var B64REV = (function () {
    var m = {};
    for (var i = 0; i < 64; i++) m[B64.charAt(i)] = i;
    return m;
  })();
  var MAXCODE = 32768;
  var hasCodec = typeof TextEncoder === "function" && typeof TextDecoder === "function";

  function bytesToB64(bytes) {
    var out = "", i = 0, n;
    for (; i + 2 < bytes.length; i += 3) {
      n = (bytes[i] << 16) | (bytes[i + 1] << 8) | bytes[i + 2];
      out += B64.charAt((n >> 18) & 63) + B64.charAt((n >> 12) & 63) +
             B64.charAt((n >> 6) & 63) + B64.charAt(n & 63);
    }
    var rem = bytes.length - i;
    if (rem === 1) {
      n = bytes[i] << 16;
      out += B64.charAt((n >> 18) & 63) + B64.charAt((n >> 12) & 63);
    } else if (rem === 2) {
      n = (bytes[i] << 16) | (bytes[i + 1] << 8);
      out += B64.charAt((n >> 18) & 63) + B64.charAt((n >> 12) & 63) + B64.charAt((n >> 6) & 63);
    }
    return out;
  }

  function b64ToBytes(str) {
    var out = [], acc = 0, bits = 0;
    for (var i = 0; i < str.length; i++) {
      var v = B64REV[str.charAt(i)];
      if (v === undefined) return null;
      acc = (acc << 6) | v;
      bits += 6;
      if (bits >= 8) { bits -= 8; out.push((acc >>> bits) & 0xFF); }
    }
    return Uint8Array.from(out);
  }

  /* LZW with variable-width codes, 9 bits up to 15. */
  function lzwEncode(bytes) {
    if (!bytes.length) return new Uint8Array(0);
    var dict = {}, width = 9, next = 256;
    var out = [], acc = 0, bits = 0;
    function emit(code) {
      acc = (acc << width) | code;
      bits += width;
      while (bits >= 8) { bits -= 8; out.push((acc >>> bits) & 0xFF); }
      acc &= (1 << bits) - 1;
    }
    var w = String.fromCharCode(bytes[0]);
    for (var i = 1; i < bytes.length; i++) {
      var c = String.fromCharCode(bytes[i]);
      var wc = w + c;
      if (dict[wc] !== undefined) { w = wc; continue; }
      emit(w.length === 1 ? w.charCodeAt(0) : dict[w]);
      if (next < MAXCODE) {
        dict[wc] = next++;
        if (next === (1 << width) && width < 15) width++;
      }
      w = c;
    }
    emit(w.length === 1 ? w.charCodeAt(0) : dict[w]);
    if (bits) out.push((acc << (8 - bits)) & 0xFF);
    return Uint8Array.from(out);
  }

  function lzwDecode(bytes) {
    if (!bytes.length) return new Uint8Array(0);
    var dict = new Array(256), i;
    for (i = 0; i < 256; i++) dict[i] = String.fromCharCode(i);
    var width = 9, acc = 0, bits = 0, pos = 0;
    function read() {
      while (bits < width) {
        if (pos >= bytes.length) return -1;
        acc = (acc << 8) | bytes[pos++];
        bits += 8;
      }
      bits -= width;
      var c = (acc >>> bits) & ((1 << width) - 1);
      acc &= (1 << bits) - 1;
      return c;
    }
    var code = read();
    if (code < 0 || code >= dict.length) return null;
    var prev = dict[code], res = [prev];
    for (;;) {
      code = read();
      if (code < 0) break;
      var entry;
      if (code < dict.length) entry = dict[code];
      else if (code === dict.length) entry = prev + prev.charAt(0);
      else return null;
      res.push(entry);
      if (dict.length < MAXCODE) {
        dict.push(prev + entry.charAt(0));
        if (dict.length + 1 === (1 << width) && width < 15) width++;
      }
      prev = entry;
    }
    var s = res.join(""), outb = new Uint8Array(s.length);
    for (i = 0; i < s.length; i++) outb[i] = s.charCodeAt(i) & 0xFF;
    return outb;
  }

  function packList(text) {
    var bytes = new TextEncoder().encode(text);
    var lzw = lzwEncode(bytes);
    var useLzw = lzw.length > 0 && lzw.length < bytes.length;
    var body = useLzw ? lzw : bytes;
    var buf = new Uint8Array(body.length + 1);
    buf[0] = useLzw ? 1 : 0;
    buf.set(body, 1);
    return bytesToB64(buf);
  }

  function unpackList(str) {
    if (!hasCodec) return null;
    var buf = b64ToBytes(str);
    if (!buf || buf.length < 2) return null;
    var body = buf.subarray(1);
    var bytes = buf[0] === 1 ? lzwDecode(body) : buf[0] === 0 ? body : null;
    if (!bytes) return null;
    /* fatal, so a mangled link falls through to the saved list rather
       than filling the wheel with replacement characters. */
    try { return new TextDecoder("utf-8", { fatal: true }).decode(bytes); }
    catch (e) { return null; }
  }

  /* ---------- shareable links ----------
     ?w=<b64>&w=<b64>              — what Copy link writes, one per wheel
     ?n=<b64>&n=                   — wheel names, positional against the
                                     w's and only present once something
                                     has been renamed
     ?t=<b64>                      — the board's own name, likewise only
                                     there once it has one
     ?list=Red%0AGreen%0A2%23Blue  — readable form, newline or comma
                                     separated, still accepted
     ?e=Red&e=Green                — one parameter per entry, for labels
                                     that contain a comma
     The readable forms only ever describe a single wheel. */

  function queryString() {
    var s = location.search.replace(/^\?/, "");
    var h = location.hash.replace(/^#/, "");
    if (!h) return s;
    /* A hand-typed "2#Blue" puts everything from the # into the fragment.
       Stitch it back on so unencoded links still work. */
    return s ? s + "#" + h : h;
  }

  function trimAll(parts) {
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var s = parts[i].trim();
      if (s) out.push(s);
    }
    return out.length ? out : null;
  }

  function cleanName(s) {
    return String(s).replace(/\s+/g, " ").trim().slice(0, MAX_NAME);
  }

  function boardFromLink() {
    var params;
    try { params = new URLSearchParams(queryString()); } catch (e) { return null; }

    var title = "";
    var rawTitle = params.get("t");
    if (rawTitle) {
      var decodedTitle = unpackList(rawTitle.trim());
      if (decodedTitle !== null) title = cleanName(decodedTitle);
    }

    var packed = params.getAll("w");
    if (packed.length) {
      var names = params.getAll("n");
      var out = [];
      for (var i = 0; i < packed.length && out.length < MAX_WHEELS; i++) {
        var text = unpackList(packed[i].trim());
        if (text === null) return null;
        var list = trimAll(text.split(/[\r\n]+/));
        if (!list) continue;
        /* A name that won't decode costs the wheel its title, not the
           whole link. */
        var name = "";
        if (names[i]) {
          var decoded = unpackList(names[i].trim());
          if (decoded !== null) name = cleanName(decoded);
        }
        out.push({ list: list, name: name });
      }
      return out.length ? { title: title, wheels: out } : null;
    }

    var parts, raw = params.get("list");
    if (raw === null) raw = params.get("entries");
    if (raw !== null) {
      parts = /[\r\n]/.test(raw) ? raw.split(/[\r\n]+/) : raw.split(",");
    } else {
      parts = params.getAll("e");
      if (!parts.length) return null;
    }
    var one = trimAll(parts);
    return one ? { title: title, wheels: [{ list: one, name: "" }] } : null;
  }

  function shareUrl() {
    var base = location.href.split(/[?#]/)[0];
    var texts = [], names = [], named = false, i;
    for (i = 0; i < wheels.length; i++) {
      var lines = wheels[i].rawLines();
      if (!lines.length) continue;
      texts.push(lines.join("\n"));
      var name = wheels[i].getName();
      if (name) named = true;
      names.push(name);
    }
    if (!texts.length) return base;
    if (!hasCodec) {
      /* No TextEncoder: fall back to the readable form rather than no
         link. It only carries one wheel, so send the first non-empty. */
      return base + "?list=" + encodeURIComponent(texts[0]);
    }
    var parts = [];
    if (boardTitle) parts.push("t=" + packList(boardTitle));
    for (i = 0; i < texts.length; i++) parts.push("w=" + packList(texts[i]));
    /* Names ride along only once there are some, so a board nobody has
       renamed still produces exactly the link it used to. */
    if (named) {
      for (i = 0; i < names.length; i++) {
        parts.push("n=" + (names[i] ? packList(names[i]) : ""));
      }
    }
    return base + "?" + parts.join("&");
  }

  /* ---------- storage ---------- */

  function readStore(key) {
    try { return JSON.parse(localStorage.getItem(key) || "null"); }
    catch (e) { return null; }
  }

  function loadState() {
    var saved = readStore(STORE_KEY);
    if (saved && Array.isArray(saved.wheels)) return saved;

    var old = readStore(LEGACY_KEY);
    if (old && typeof old === "object") {
      var text = typeof old.text === "string" ? old.text
        : Array.isArray(old.entries) ? old.entries.join("\n") : "";
      return {
        title: "",
        wheels: [{ text: text, name: "", history: Array.isArray(old.history) ? old.history : [] }],
        sound: typeof old.sound === "boolean" ? old.sound : true,
        panel: typeof old.panel === "boolean" ? old.panel : true
      };
    }
    return null;
  }

  function wheelsForSave() {
    var live = [], i;
    for (i = 0; i < wheels.length; i++) live.push(wheels[i].serialize());
    if (!boardFromUrl) return live;

    /* Still showing a link: write back the board that was already saved,
       but let the spins that happened here land in its history. */
    var kept = (shadow && shadow.wheels) ? shadow.wheels : [];
    if (!kept.length) kept = [{ text: "", name: "", history: [] }];
    var out = [];
    for (i = 0; i < kept.length; i++) {
      out.push({
        text: typeof kept[i].text === "string" ? kept[i].text : "",
        name: typeof kept[i].name === "string" ? kept[i].name : "",
        history: live[i] ? live[i].history : (Array.isArray(kept[i].history) ? kept[i].history : [])
      });
    }
    return out;
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        v: 2,
        title: boardFromUrl ? ((shadow && shadow.title) || "") : boardTitle,
        wheels: wheelsForSave(),
        sound: soundOn,
        panel: panelOpen
      }));
    } catch (e) { /* ignore and continue, page works without storage */ }
  }

  function claimBoard() {
    if (!boardFromUrl) return;
    boardFromUrl = false;
    for (var i = 0; i < wheels.length; i++) wheels[i].setHint("");
  }

  /* ---------- sound ---------- */

  var audio = null;
  var lastClick = 0;

  function ac() {
    if (!soundOn) return null;
    if (!audio) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      try { audio = new Ctx(); } catch (e) { return null; }
    }
    if (audio.state === "suspended") audio.resume();
    return audio;
  }

  function spinningCount() {
    var n = 0;
    for (var i = 0; i < wheels.length; i++) if (wheels[i].isSpinning()) n++;
    return n;
  }

  /* Several wheels turning at once would otherwise stack into a buzz, so
     clicks are rate-limited across the board and every voice is scaled
     back by how many wheels are making noise. */
  function voices() { return Math.max(1, Math.sqrt(spinningCount())); }

  function click() {
    var a = ac();
    if (!a) return;
    var now = a.currentTime;
    if (now - lastClick < 0.016) return;
    lastClick = now;
    var osc = a.createOscillator();
    var gain = a.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(1250, now);
    osc.frequency.exponentialRampToValueAtTime(620, now + 0.03);
    gain.gain.setValueAtTime(0.07 / voices(), now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);
    osc.connect(gain).connect(a.destination);
    osc.start(now);
    osc.stop(now + 0.05);
  }

  function chime() {
    var a = ac();
    if (!a) return;
    var t = a.currentTime;
    var peak = 0.16 / voices();
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
      var osc = a.createOscillator();
      var gain = a.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(f, t + i * 0.085);
      gain.gain.setValueAtTime(0.0001, t + i * 0.085);
      gain.gain.exponentialRampToValueAtTime(peak, t + i * 0.085 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.085 + 0.5);
      osc.connect(gain).connect(a.destination);
      osc.start(t + i * 0.085);
      osc.stop(t + i * 0.085 + 0.55);
    });
  }

  /* ---------- board geometry ---------- */

  function chromeHeight() {
    var pg = getComputedStyle(pageEl);
    var root = getComputedStyle(document.documentElement);
    return parseFloat(root.paddingTop) + parseFloat(root.paddingBottom) +
      parseFloat(pg.paddingTop) + parseFloat(pg.paddingBottom) +
      mastheadEl.offsetHeight + parseFloat(getComputedStyle(mastheadEl).marginBottom) + 6;
  }

  var boardCols = 1;

  function layoutBoard() {
    var n = wheels.length;
    var minCard = panelOpen ? 380 : 320;
    /* One wheel keeps the tall-and-narrow measure the page was built
       around; a board of them wants every pixel it can get. */
    pageEl.style.maxWidth = n > 1 ? "2400px" : "";
    var avail = boardEl.clientWidth || window.innerWidth;
    var byWidth = Math.max(1, Math.floor((avail + GRID_GAP) / (minCard + GRID_GAP)));
    /* Up to three wheels read best in a single row; past that a squarish
       grid keeps every wheel a usable size. */
    var ideal = n <= 3 ? n : Math.ceil(Math.sqrt(n));
    boardCols = Math.max(1, Math.min(ideal, byWidth));
    boardEl.style.setProperty("--cols", boardCols);
    boardEl.classList.toggle("is-multi", n > 1);
  }

  function boardRows() {
    return Math.max(1, Math.ceil(wheels.length / boardCols));
  }

  function relayout() {
    layoutBoard();
    var i;
    for (i = 0; i < wheels.length; i++) wheels[i].fit();
    for (i = 0; i < wheels.length; i++) wheels[i].resize();
  }

  /* ---------- triggers ---------- */

  function wheelByName(name) {
    var want = String(name).trim().toLowerCase();
    if (!want) return null;
    for (var i = 0; i < wheels.length; i++) {
      if (wheels[i].displayName().toLowerCase() === want) return wheels[i];
    }
    return null;
  }

  /* "Coffee!Snacks" hands the spin on to the wheel called Snacks once
     Coffee wins. The part after the ! has to name a wheel that exists,
     which is what lets an ordinary "Ready! Set" stay the label it looks
     like — no escaping, and a typo'd target reads back as plain text. */
  function splitTrigger(label) {
    var at = label.lastIndexOf("!");
    if (at < 1) return null;
    var target = label.slice(at + 1).trim();
    var head = label.slice(0, at).trim();
    if (!target || !head || !wheelByName(target)) return null;
    return { label: head, target: target };
  }

  /* Naming, adding or removing a wheel changes which triggers resolve,
     so every wheel re-reads its list whenever the roster moves. */
  function resyncAll() {
    for (var i = 0; i < wheels.length; i++) wheels[i].resync();
  }

  /* ---------- a wheel ---------- */

  function createWheel(init) {
    var card = tpl.content.firstElementChild.cloneNode(true);
    var uid = "w" + (++wheelSeq);
    function q(sel) { return card.querySelector(sel); }

    var canvas = q(".wheel-canvas");
    var ctx = canvas.getContext("2d");
    var wrap = q(".wheel-wrap");
    var pointerEl = q(".pointer");
    var spinTarget = q(".spin-target");
    var stageEl = q(".stage");
    var entriesEl = q(".entries");
    var hintEl = q(".hint");
    var countEl = q(".count");
    var oddsEl = q(".odds");
    var verdictEl = q(".verdict");
    var verdictLabel = q(".verdict-label");
    var verdictName = q(".verdict-name");
    var verdictActions = q(".verdict-actions");
    var spinBtn = q(".act.spin");
    var againBtn = q(".act.again");
    var removeBtn = q(".act.remove");
    var clearBtn = q(".act.clear");
    var historyEl = q(".history");
    var historyEmpty = q(".history-empty");
    var clearHistoryBtn = q(".clear-history");
    var helpBtn = q(".info-btn");
    var helpPop = q(".help-pop");
    var nameEl = q(".card-name");
    var headEl = q(".card-head");
    var removeWheelBtn = q(".card-remove");

    entriesEl.id = uid + "-entries";
    q(".entries-label").htmlFor = entriesEl.id;
    hintEl.id = uid + "-hint";
    entriesEl.setAttribute("aria-describedby", hintEl.id);
    helpPop.id = uid + "-help";
    helpBtn.setAttribute("aria-controls", helpPop.id);

    var entries = [];
    var history = (init && Array.isArray(init.history)) ? init.history.slice(0, 40) : [];
    var theta = 0;
    var flap = 0;
    var spinning = false;
    var winnerIdx = -1;
    var size = 0;
    var totalWeight = 0;
    var bounds = [0];
    var idleOdds = "";

    entriesEl.value = (init && typeof init.text === "string") ? init.text : "";
    nameEl.value = (init && typeof init.name === "string") ? cleanName(init.name) : "";

    /* ---------- entries ---------- */

    /* "2#Blue" or "1.5#Blue" — a leading number and # set the entry's
       weight. Anything else is a plain entry weighing 1. */
    var WEIGHT_RE = /^(\d*\.?\d+)\s*#\s*(.+)$/;

    function readEntries() {
      var lines = entriesEl.value.split("\n");
      var out = [];
      for (var i = 0; i < lines.length && out.length < MAX_ENTRIES; i++) {
        var s = lines[i].trim();
        if (!s) continue;
        var m = WEIGHT_RE.exec(s);
        var weight = m ? parseFloat(m[1]) : 1;
        /* A zero weight is a slice nobody can land on — leave it off. */
        if (!(weight > 0)) continue;
        var label = m ? m[2].trim() : s;
        var trig = splitTrigger(label);
        out.push({
          label: trig ? trig.label : label,
          weight: weight,
          line: i,
          trigger: trig ? trig.target : ""
        });
      }
      return out;
    }

    function rawLines() {
      var lines = entriesEl.value.split("\n");
      var out = [];
      for (var i = 0; i < lines.length; i++) {
        var s = lines[i].trim();
        if (s) out.push(s);
      }
      return out;
    }

    function computeBounds() {
      var n = entries.length, i;
      totalWeight = 0;
      for (i = 0; i < n; i++) totalWeight += entries[i].weight;
      bounds = [0];
      var acc = 0;
      for (i = 0; i < n; i++) {
        acc += entries[i].weight;
        bounds.push((acc / totalWeight) * TAU);
      }
      if (n) bounds[n] = TAU;
    }

    function sliceAt(rot) {
      var n = entries.length;
      if (!n) return -1;
      var a = ((-rot) % TAU + TAU) % TAU;
      var lo = 0, hi = n - 1;
      while (lo < hi) {
        var mid = (lo + hi + 1) >> 1;
        if (bounds[mid] <= a) lo = mid; else hi = mid - 1;
      }
      return lo;
    }

    function trimNum(v) {
      return String(Math.round(v * 1000) / 1000);
    }

    function colorFor(i, n) {
      var c = i % PALETTE.length;
      if (n > 2 && i === n - 1 && c === 0) c = 5;
      return PALETTE[c];
    }

    function syncEntries(redraw) {
      entries = readEntries();
      computeBounds();
      var n = entries.length, weighted = false;
      for (var i = 0; i < n; i++) {
        if (entries[i].weight !== 1) { weighted = true; break; }
      }
      countEl.textContent = n === 1 ? "1 slice" : n + " slices";
      idleOdds = !n ? ""
        : weighted
          ? n + (n === 1 ? " slice" : " slices") + " · " + trimNum(totalWeight) + " total weight"
          : (360 / n).toFixed(1) + "° per slice · 1 in " + n + " odds";
      if (winnerIdx < 0) oddsEl.textContent = idleOdds;
      spinBtn.disabled = spinning || n < 1;
      spinTarget.disabled = spinning || n < 1;
      syncSpinAll();
      if (redraw !== false) draw();
      save();
    }

    function resetVerdict() {
      winnerIdx = -1;
      verdictEl.classList.remove("is-won");
      verdictLabel.textContent = "Ready";
      verdictName.className = "verdict-name is-idle";
      verdictName.textContent = entries.length
        ? "Tap the wheel to pick a winner."
        : "Add a few entries to build the wheel.";
      verdictActions.classList.add("is-idle");
      oddsEl.textContent = idleOdds;
      fit();
    }

    /* ---------- label fitting ---------- */

    var MEASURE_PX = 100;
    var LINE_EM = 1.14;
    var SAFETY = 0.9;

    function unitWidth(s) {
      return ctx.measureText(s).width / MEASURE_PX;
    }

    function sizeForLines(lines, seg, outerR, maxW, maxSize) {
      var uMax = 0;
      for (var i = 0; i < lines.length; i++) {
        var u = unitWidth(lines[i]);
        if (u > uMax) uMax = u;
      }
      if (uMax <= 0) return 0;
      var hEm = lines.length === 1 ? 1 : lines.length * LINE_EM;
      var byHeight = (seg * outerR * SAFETY) / (hEm + seg * uMax);
      var byWidth = maxW / uMax;
      return Math.min(byHeight, byWidth, maxSize);
    }

    function splitInto(words, n) {
      if (words.length < n) return null;
      if (n === 1) return [words.join(" ")];
      var best = null, bestW = Infinity, i, j;
      if (n === 2) {
        for (i = 1; i < words.length; i++) {
          var a = words.slice(0, i).join(" "), b = words.slice(i).join(" ");
          var w = Math.max(unitWidth(a), unitWidth(b));
          if (w < bestW) { bestW = w; best = [a, b]; }
        }
        return best;
      }
      for (i = 1; i < words.length - 1; i++) {
        for (j = i + 1; j < words.length; j++) {
          var p = words.slice(0, i).join(" ");
          var qq = words.slice(i, j).join(" ");
          var r = words.slice(j).join(" ");
          var m = Math.max(unitWidth(p), unitWidth(qq), unitWidth(r));
          if (m < bestW) { bestW = m; best = [p, qq, r]; }
        }
      }
      return best;
    }

    function layoutLabel(text, seg, outerR, maxW, maxSize) {
      var words = text.split(/\s+/).filter(Boolean);
      var best = { lines: [text], size: sizeForLines([text], seg, outerR, maxW, maxSize) };
      var maxLines = words.length > 10 ? 2 : 3;
      for (var n = 2; n <= maxLines; n++) {
        var lines = splitInto(words, n);
        if (!lines) break;
        var s = sizeForLines(lines, seg, outerR, maxW, maxSize);
        /* Only spend an extra line if it buys a meaningfully bigger face. */
        if (s > best.size * 1.08) best = { lines: lines, size: s };
      }
      return best;
    }

    /* ---------- sizing ---------- */

    function fit() {
      var st = getComputedStyle(stageEl);
      var isRow = st.flexDirection === "row";

      var w = stageEl.clientWidth;
      if (isRow) w -= verdictEl.offsetWidth + (parseFloat(st.columnGap) || 28);

      /* Everything in the card that isn't the wheel: the title bar, and
         the frame the card wears once there is more than one of them. */
      var cs = getComputedStyle(card);
      var hs = getComputedStyle(headEl);
      var overhead = headEl.offsetHeight + (parseFloat(hs.marginBottom) || 0) +
        parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);

      var rows = boardRows();
      var h = (window.innerHeight - chromeHeight() - (rows - 1) * GRID_GAP) / rows - overhead;
      if (!isRow) h -= verdictEl.offsetHeight + (parseFloat(st.rowGap) || 20);
      /* Tiled rows share the viewport, but never shrink a wheel past the
         point of being readable — the page can scroll instead. */
      if (wheels.length > 1) h = Math.max(h, 300);

      var px = Math.max(260, Math.min(w, h));
      var cur = parseFloat(stageEl.style.getPropertyValue("--wheel-w")) || 0;
      if (Math.abs(px - cur) > 1) {
        stageEl.style.setProperty("--wheel-w", px.toFixed(1) + "px");
      }
    }

    function resize() {
      var w = Math.round(wrap.clientWidth);
      if (!w) return;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      size = w;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(w * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    /* ---------- drawing ---------- */

    function draw() {
      if (!size) return;
      var n = entries.length;
      var cx = size / 2, cy = size / 2;
      var rim = Math.max(8, size * 0.042);
      var R = size / 2 - rim - 2;
      var hubR = size * 0.115;
      var css = getComputedStyle(document.documentElement);
      var rimA = css.getPropertyValue("--rim-a").trim() || "#F0DCA8";
      var rimB = css.getPropertyValue("--rim-b").trim() || "#A9721B";
      var rimC = css.getPropertyValue("--rim-c").trim() || "#6E4910";

      ctx.clearRect(0, 0, size, size);

      /* Rim: a brass band carrying one peg per slice boundary. */
      var band = ctx.createLinearGradient(0, 0, size, size);
      band.addColorStop(0, rimA);
      band.addColorStop(0.42, rimB);
      band.addColorStop(1, rimC);
      ctx.beginPath();
      ctx.arc(cx, cy, R + rim / 2, 0, TAU);
      ctx.lineWidth = rim;
      ctx.strokeStyle = band;
      ctx.stroke();

      if (!n) {
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, TAU);
        ctx.fillStyle = css.getPropertyValue("--surface-2").trim() || "#F2F0F8";
        ctx.fill();
        ctx.setLineDash([7, 8]);
        ctx.lineWidth = 2;
        ctx.strokeStyle = css.getPropertyValue("--line").trim() || "#D5D1E2";
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = css.getPropertyValue("--ink-soft").trim() || "#5C5670";
        ctx.font = "500 " + Math.max(12, size * 0.036) + "px Archivo, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        return;
      }

      for (var i = 0; i < n; i++) {
        var a0 = bounds[i] - Math.PI / 2;
        var a1 = bounds[i + 1] - Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, R, a0, a1);
        ctx.closePath();
        ctx.fillStyle = colorFor(i, n);
        ctx.fill();
        if (n <= 60) {
          ctx.lineWidth = 1;
          ctx.strokeStyle = "rgba(0,0,0,.18)";
          ctx.stroke();
        }
      }

      /* The winning slice gets lifted rather than announced twice. */
      if (winnerIdx >= 0 && winnerIdx < n) {
        var w0 = bounds[winnerIdx] - Math.PI / 2;
        var w1 = bounds[winnerIdx + 1] - Math.PI / 2;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, R, w0, w1);
        ctx.closePath();
        ctx.fillStyle = "rgba(255,255,255,.26)";
        ctx.fill();
        ctx.lineWidth = Math.max(2, size * 0.008);
        ctx.strokeStyle = "rgba(255,255,255,.9)";
        ctx.stroke();
        ctx.restore();
      }

      var outerR = R - size * 0.035;
      var innerR = hubR + size * 0.025;
      var maxW = outerR - innerR;
      var maxSize = size * 0.055;

      ctx.font = "600 " + MEASURE_PX + "px Archivo, sans-serif";
      ctx.save();
      ctx.translate(cx, cy);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#FFFFFF";
      for (var j = 0; j < n; j++) {
        var lay = layoutLabel(entries[j].label, bounds[j + 1] - bounds[j], outerR, maxW, maxSize);
        if (!(lay.size > 0.5)) continue;
        ctx.save();
        ctx.rotate((bounds[j] + bounds[j + 1]) / 2 - Math.PI / 2);
        ctx.font = "600 " + lay.size.toFixed(2) + "px Archivo, sans-serif";
        ctx.shadowColor = "rgba(0,0,0,.42)";
        ctx.shadowBlur = Math.max(2, lay.size * 0.16);
        ctx.shadowOffsetY = Math.max(1, lay.size * 0.05);
        var lh = lay.size * LINE_EM;
        var y = -((lay.lines.length - 1) / 2) * lh;
        for (var k = 0; k < lay.lines.length; k++) {
          ctx.fillText(lay.lines[k], outerR, y + k * lh);
        }
        ctx.restore();
      }
      ctx.restore();

      /* Pegs sit on the boundaries so the flapper has something to hit. */
      var pegs = n <= 60 ? n : 0;
      for (var p = 0; p < pegs; p++) {
        var pa = bounds[p] - Math.PI / 2;
        var pr = R + rim / 2;
        var px = cx + Math.cos(pa) * pr;
        var py = cy + Math.sin(pa) * pr;
        var pRad = Math.max(1.6, rim * 0.21);
        ctx.beginPath();
        ctx.arc(px, py, pRad, 0, TAU);
        ctx.fillStyle = rimA;
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = rimC;
        ctx.stroke();
      }

      /* Inner bevel under the hub cap. */
      ctx.beginPath();
      ctx.arc(cx, cy, hubR, 0, TAU);
      ctx.fillStyle = css.getPropertyValue("--hub-face").trim() || "#FBF8F1";
      ctx.fill();
    }

    /* ---------- spinning ---------- */

    function setSpinning(on) {
      spinning = on;
      spinBtn.disabled = on || entries.length < 1;
      spinTarget.disabled = on || entries.length < 1;
      clearBtn.disabled = on;
      againBtn.disabled = on;
      removeBtn.disabled = on;
      removeWheelBtn.disabled = on;
      entriesEl.readOnly = on;
      spinBtn.textContent = on ? "Spinning…" : "Spin the wheel";
      syncSpinAll();
    }

    /* A chain is the list of wheels a single user-initiated spin has
       already set going. Each wheel joins once, which is what stops
       "A!B" and "B!A" spinning each other forever. */
    function spin() { startSpin([]); }

    function startSpin(chain) {
      if (spinning || chain.indexOf(api) >= 0) return;
      var trail = chain.concat([api]);
      syncEntries(false);
      var n = entries.length;
      if (!n) { resetVerdict(); draw(); return; }

      setSpinning(true);
      winnerIdx = -1;
      verdictEl.classList.remove("is-won");
      verdictLabel.textContent = "Spinning";
      verdictName.className = "verdict-name is-idle";
      verdictName.textContent = "…";
      verdictActions.classList.add("is-idle");
      draw();

      var reduced = reduceMotion.matches;
      var r = Math.random() * totalWeight;
      var acc = 0, winner = n - 1;
      for (var i = 0; i < n; i++) {
        acc += entries[i].weight;
        if (r < acc) { winner = i; break; }
      }
      /* Land inside the slice, never on a peg. */
      var span = bounds[winner + 1] - bounds[winner];
      var aim = bounds[winner] + (0.18 + 0.64 * Math.random()) * span;
      var base = ((-aim) % TAU + TAU) % TAU;
      var turns = reduced ? 0 : 4 + Math.floor(Math.random() * 4);
      var target = base;
      while (target < theta + turns * TAU + 0.0001) target += TAU;

      var start = theta;
      var delta = target - start;
      var dur = reduced ? 650 : 4400 + Math.random() * 1600;
      var t0 = performance.now();
      var lastSlice = sliceAt(start);

      function frame(now) {
        var t = Math.min(1, (now - t0) / dur);
        var eased = 1 - Math.pow(1 - t, 4.2);
        theta = start + delta * eased;

        var slice = sliceAt(theta);
        if (slice !== lastSlice) {
          lastSlice = slice;
          if (!reduced) { click(); flap = -11; }
        }
        flap += (0 - flap) * 0.28;

        canvas.style.transform = "rotate(" + theta + "rad)";
        pointerEl.style.transform = reduced ? "" : "rotate(" + flap.toFixed(2) + "deg)";

        if (t < 1) { requestAnimationFrame(frame); }
        else {
          theta = ((target % TAU) + TAU) % TAU;
          canvas.style.transform = "rotate(" + theta + "rad)";
          pointerEl.style.transform = "";
          finish(winner, trail);
        }
      }
      requestAnimationFrame(frame);
    }

    function finish(idx, trail) {
      /* Read the volume before setSpinning drops this wheel from the
         count, so a lone finisher in a crowd isn't suddenly blaring. */
      chime();
      setSpinning(false);
      winnerIdx = idx;
      draw();

      var entry = entries[idx];
      var name = entry.label;
      var share = entry.weight / totalWeight;
      verdictEl.classList.add("is-won");
      verdictLabel.textContent = "Winner";
      verdictName.className = "verdict-name";
      verdictName.textContent = name;
      verdictActions.classList.remove("is-idle");

      var odds = (share * 100).toFixed(1) + "% chance · " +
        (share * 360).toFixed(1) + "° slice";
      var next = entry.trigger ? wheelByName(entry.trigger) : null;
      if (next && trail.indexOf(next) < 0) {
        odds += " · spins " + next.displayName();
        /* A beat before the next wheel goes, so the winner that caused
           it has a moment to be read. Re-resolve on the way in: the
           board can change while we wait. */
        var target = entry.trigger;
        setTimeout(function () {
          var w = wheelByName(target);
          if (!w || trail.indexOf(w) >= 0) return;
          setActive(w);
          w.spinFrom(trail);
        }, reduceMotion.matches ? 0 : 600);
      }
      oddsEl.textContent = odds;
      fit();

      history.unshift(name);
      if (history.length > 40) history.pop();
      renderHistory();
      save();
    }

    function renderHistory() {
      historyEl.textContent = "";
      historyEmpty.hidden = history.length > 0;
      clearHistoryBtn.hidden = history.length === 0;
      for (var i = 0; i < history.length; i++) {
        var li = document.createElement("li");
        var n = document.createElement("span");
        n.className = "n";
        n.textContent = String(history.length - i).padStart(2, "0");
        var who = document.createElement("span");
        who.className = "who";
        who.textContent = history[i];
        li.appendChild(n);
        li.appendChild(who);
        historyEl.appendChild(li);
      }
    }

    /* ---------- events ---------- */

    function activate() { setActive(api); }

    card.addEventListener("focusin", activate);
    card.addEventListener("pointerdown", activate);

    spinTarget.addEventListener("click", spin);
    spinBtn.addEventListener("click", spin);
    againBtn.addEventListener("click", spin);

    removeBtn.addEventListener("click", function () {
      if (spinning || winnerIdx < 0) return;
      var entry = entries[winnerIdx];
      if (!entry) return;
      var lines = entriesEl.value.split("\n");
      if (entry.line < lines.length) lines.splice(entry.line, 1);
      entriesEl.value = lines.join("\n").replace(/^\n+/, "");
      claimBoard();
      resetVerdict();
      syncEntries();
      entriesEl.focus();
    });

    clearBtn.addEventListener("click", function () {
      if (spinning) return;
      entriesEl.value = "";
      claimBoard();
      setHint("");
      resetVerdict();
      syncEntries();
      entriesEl.focus();
    });

    clearHistoryBtn.addEventListener("click", function () {
      history = [];
      renderHistory();
      save();
    });

    entriesEl.addEventListener("input", function () {
      claimBoard();
      setHint("");
      if (winnerIdx >= 0) resetVerdict();
      syncEntries();
    });

    removeWheelBtn.addEventListener("click", function () {
      if (spinning) return;
      removeWheel(api);
    });

    /* An empty name isn't a nameless wheel — the placeholder carries the
       "Wheel 3" default, so clearing the field just restores it. */
    function displayName() {
      return nameEl.value.trim() || nameEl.placeholder;
    }

    function syncName() {
      removeWheelBtn.setAttribute("aria-label", "Remove " + displayName());
    }

    nameEl.addEventListener("input", function () {
      claimBoard();
      syncName();
      save();
    });

    /* Triggers are re-resolved when the name settles, not per keystroke
       — resyncAll redraws every wheel on the board. */
    nameEl.addEventListener("change", function () {
      nameEl.value = cleanName(nameEl.value);
      syncName();
      resyncAll();
    });

    nameEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === "Escape") {
        nameEl.blur();
        e.preventDefault();
        e.stopPropagation();
      }
    });

    helpBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      setHelp(helpPop.hidden);
    });

    function setHelp(open) {
      helpPop.hidden = !open;
      helpBtn.setAttribute("aria-expanded", open ? "true" : "false");
    }

    function setHint(msg) {
      hintEl.textContent = msg || "";
      hintEl.hidden = !msg;
    }

    var ro = null;
    if (window.ResizeObserver) {
      ro = new ResizeObserver(resize);
      ro.observe(wrap);
    }

    var api = {
      el: card,
      spin: spin,
      spinFrom: startSpin,
      displayName: displayName,
      resync: function () { syncEntries(true); },
      draw: draw,
      fit: fit,
      resize: resize,
      rawLines: rawLines,
      setHint: setHint,
      isSpinning: function () { return spinning; },
      canSpin: function () { return !spinning && entries.length > 0; },
      init: function () { syncEntries(false); resetVerdict(); syncName(); },
      getName: function () { return cleanName(nameEl.value); },
      serialize: function () {
        return {
          text: entriesEl.value,
          name: cleanName(nameEl.value),
          history: history.slice(0, 40)
        };
      },
      setOrdinal: function (i) {
        nameEl.placeholder = "Wheel " + i;
        nameEl.setAttribute("aria-label", "Name of wheel " + i);
        syncName();
      },
      focusEntries: function () { entriesEl.focus(); },
      destroy: function () {
        if (ro) ro.disconnect();
        if (card.parentNode) card.parentNode.removeChild(card);
      }
    };

    /* The rest of the wiring waits for api.init(), which addWheel calls
       once the card is mounted and the board knows this wheel exists. */
    renderHistory();
    return api;
  }

  /* ---------- board management ---------- */

  function setActive(wheel) {
    if (activeWheel === wheel) return;
    if (activeWheel) activeWheel.el.classList.remove("is-active");
    activeWheel = wheel;
    if (activeWheel) activeWheel.el.classList.add("is-active");
  }

  function renumber() {
    for (var i = 0; i < wheels.length; i++) wheels[i].setOrdinal(i + 1);
  }

  function syncChrome() {
    var n = wheels.length;
    addWheelBtn.disabled = n >= MAX_WHEELS;
    spinAllBtn.hidden = n < 2;
    panelToggleLabel.textContent = (panelOpen ? "Hide list" : "Show list") + (n > 1 ? "s" : "");
    syncSpinAll();
  }

  function syncSpinAll() {
    if (spinAllBtn.hidden) return;
    var any = false;
    for (var i = 0; i < wheels.length; i++) {
      if (wheels[i].canSpin()) { any = true; break; }
    }
    spinAllBtn.disabled = !any;
  }

  function addWheel(init, quiet) {
    if (wheels.length >= MAX_WHEELS) return null;
    var wheel = createWheel(init);
    wheels.push(wheel);
    boardEl.appendChild(wheel.el);
    wheel.init();
    renumber();
    resyncAll();
    syncChrome();
    if (!activeWheel) setActive(wheel);
    if (!quiet) {
      setActive(wheel);
      relayout();
      save();
      wheel.focusEntries();
      wheel.el.scrollIntoView({ block: "nearest", behavior: reduceMotion.matches ? "auto" : "smooth" });
    }
    return wheel;
  }

  function removeWheel(wheel) {
    var i = wheels.indexOf(wheel);
    if (i < 0) return;
    /* The board is never empty — removing the last one leaves a blank
       wheel rather than nothing to type into. */
    claimBoard();
    wheels.splice(i, 1);
    wheel.destroy();
    if (activeWheel === wheel) {
      activeWheel = null;
      setActive(wheels[Math.min(i, wheels.length - 1)] || null);
    }
    if (!wheels.length) addWheel({ text: "", name: "", history: [] }, true);
    renumber();
    resyncAll();
    syncChrome();
    relayout();
    save();
  }

  function setPanel(open) {
    panelOpen = open;
    boardEl.classList.toggle("is-collapsed", !open);
    panelToggle.setAttribute("aria-expanded", open ? "true" : "false");
    syncChrome();
    requestAnimationFrame(relayout);
  }

  function setSound(on) {
    soundOn = on;
    soundBtn.setAttribute("aria-pressed", on ? "true" : "false");
  }

  /* ---------- board title ---------- */

  /* The wordmark is the board's name. Left alone it stays the app's own
     title, two-tone and paired with the tagline; once someone names the
     board, that name replaces both — the pitch has served its purpose. */
  function renderTitle() {
    titleText.textContent = "";
    if (boardTitle) {
      titleText.appendChild(document.createTextNode(boardTitle));
    } else {
      var em = document.createElement("em");
      em.textContent = "Win";
      titleText.appendChild(document.createTextNode("Spin to "));
      titleText.appendChild(em);
    }
    document.title = boardTitle || "Spin to Win";
    taglineEl.hidden = !!boardTitle;
  }

  var titleEditing = false;

  function openTitle() {
    titleInput.value = boardTitle;
    titleEditing = true;
    titleBtn.hidden = true;
    titleInput.hidden = false;
    titleInput.focus();
    titleInput.select();
  }

  /* Hiding the input fires its own blur, so the guard is what keeps
     Escape from being undone by the handler that follows it. */
  function closeTitle(commit, refocus) {
    if (!titleEditing) return;
    titleEditing = false;
    if (commit) {
      var next = cleanName(titleInput.value);
      if (next !== boardTitle) {
        boardTitle = next;
        claimBoard();
        renderTitle();
        /* Losing the tagline changes the masthead's height, and the
           wheels are sized against what the masthead leaves over. */
        relayout();
        save();
      }
    }
    titleInput.hidden = true;
    titleBtn.hidden = false;
    if (refocus) titleBtn.focus();
  }

  titleBtn.addEventListener("click", openTitle);
  titleInput.addEventListener("blur", function () { closeTitle(true, false); });
  titleInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { closeTitle(true, true); e.preventDefault(); e.stopPropagation(); }
    else if (e.key === "Escape") { closeTitle(false, true); e.preventDefault(); e.stopPropagation(); }
  });

  /* ---------- header ---------- */

  addWheelBtn.addEventListener("click", function () {
    claimBoard();
    var wheel = addWheel({ text: "", name: "", history: [] });
    if (wheel) wheel.setHint("Empty wheel — type some entries.");
  });

  spinAllBtn.addEventListener("click", function () {
    for (var i = 0; i < wheels.length; i++) wheels[i].spin();
  });

  panelToggle.addEventListener("click", function () {
    setPanel(!panelOpen);
    save();
  });

  soundBtn.addEventListener("click", function () {
    setSound(!soundOn);
    save();
  });

  var copyTimer = 0;
  function flashCopy(msg) {
    copyLabel.textContent = msg;
    clearTimeout(copyTimer);
    copyTimer = setTimeout(function () { copyLabel.textContent = "Copy link"; }, 1800);
  }

  function copyFallback(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:-9999px";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  copyBtn.addEventListener("click", function () {
    var url = shareUrl();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(
        function () { flashCopy("Link copied"); },
        function () { flashCopy(copyFallback(url) ? "Link copied" : "Copy failed"); }
      );
    } else {
      flashCopy(copyFallback(url) ? "Link copied" : "Copy failed");
    }
  });

  /* ---------- global keys and popovers ---------- */

  function closeHelps(keep) {
    var pops = document.querySelectorAll(".help-pop:not([hidden])");
    for (var i = 0; i < pops.length; i++) {
      if (keep && pops[i].contains(keep)) continue;
      pops[i].hidden = true;
      var btn = pops[i].parentNode.querySelector(".info-btn");
      if (btn) btn.setAttribute("aria-expanded", "false");
    }
  }

  document.addEventListener("click", function (e) {
    closeHelps(e.target);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && document.querySelector(".help-pop:not([hidden])")) {
      closeHelps();
      return;
    }
    if (e.code === "Space") {
      var el = document.activeElement;
      /* Space belongs to whatever is focused if that thing uses it. */
      if (el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT" ||
                 el.tagName === "BUTTON" || el.isContentEditable)) return;
      if (activeWheel) {
        activeWheel.spin();
        e.preventDefault();
      }
    }
  });

  window.addEventListener("resize", relayout);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      for (var i = 0; i < wheels.length; i++) { wheels[i].fit(); wheels[i].draw(); }
    });
  }

  /* ---------- boot ---------- */

  (function boot() {
    shadow = loadState();
    if (shadow && typeof shadow.sound === "boolean") soundOn = shadow.sound;
    if (shadow && typeof shadow.panel === "boolean") panelOpen = shadow.panel;
    if (shadow && typeof shadow.title === "string") boardTitle = cleanName(shadow.title);

    var shared = boardFromLink();
    var i, init = [];

    if (shared) {
      boardFromUrl = true;
      boardTitle = shared.title;
      for (i = 0; i < shared.wheels.length; i++) {
        init.push({
          text: shared.wheels[i].list.join("\n"),
          name: shared.wheels[i].name,
          history: []
        });
      }
    } else if (shadow && shadow.wheels.length) {
      for (i = 0; i < shadow.wheels.length && i < MAX_WHEELS; i++) {
        var w = shadow.wheels[i] || {};
        init.push({
          text: typeof w.text === "string" ? w.text : "",
          name: typeof w.name === "string" ? w.name : "",
          history: Array.isArray(w.history) ? w.history : []
        });
      }
      /* A saved board of nothing but blanks is the same as no board. */
      var anyContent = false;
      for (i = 0; i < init.length; i++) {
        if (init[i].text.trim() || init[i].name) anyContent = true;
      }
      if (!anyContent && init.length === 1) init = [];
    }

    var sampled = false;
    if (!init.length) {
      init = [{ text: SAMPLE.join("\n"), name: "", history: [] }];
      sampled = true;
    }

    setSound(soundOn);
    renderTitle();
    for (i = 0; i < init.length; i++) addWheel(init[i], true);
    setActive(wheels[0]);

    if (boardFromUrl) {
      var msg = wheels.length > 1
        ? "Board loaded from the link. Editing it makes it yours."
        : "List loaded from the link. Editing it makes it yours.";
      for (i = 0; i < wheels.length; i++) wheels[i].setHint(msg);
    } else if (sampled) {
      wheels[0].setHint("Sample list loaded — replace it with your own names.");
    }

    setPanel(panelOpen);
    syncChrome();
    relayout();
  })();
})();
</script>
